<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinApp</title>
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinApp">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0b0e14; --surface:#131924; --surface-2:#182030; --surface-3:#212b3b;
  --border:#26303f; --border-soft:#1d2532;
  --text:#e9edf4; --text-dim:#8b95a8; --text-faint:#5b6577;
  --accent:#5b8def; --accent-soft:rgba(91,141,239,.16);
  --interest:#e0796a; --interest-soft:rgba(224,121,106,.15);
  --principal:#48b586; --principal-soft:rgba(72,181,134,.15);
  --planned:#9b7ee8; --planned-soft:rgba(155,126,232,.16);
  --confirmed:#3fb6b0; --confirmed-soft:rgba(63,182,176,.16);
  --forgone:#dba43e; --forgone-soft:rgba(219,164,62,.15);
  --danger:#e0605a;
  --radius:20px; --radius-sm:13px;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Menlo","Cascadia Code",monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#eef0f4; --surface:#ffffff; --surface-2:#f7f8fb; --surface-3:#edf0f5;
    --border:#e0e4ea; --border-soft:#eceff3;
    --text:#161b22; --text-dim:#5f6b7d; --text-faint:#8b95a8;
    --accent:#3868d6; --accent-soft:rgba(56,104,214,.10);
    --interest:#c1543f; --interest-soft:rgba(193,84,63,.10);
    --principal:#1c8f63; --principal-soft:rgba(28,143,99,.10);
    --planned:#7a5cc9; --planned-soft:rgba(122,92,201,.10);
    --confirmed:#1f8f8a; --confirmed-soft:rgba(31,143,138,.10);
    --forgone:#a9762a; --forgone-soft:rgba(169,118,42,.10);
    --danger:#c1423a;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e14; --surface:#131924; --surface-2:#182030; --surface-3:#212b3b;
  --border:#26303f; --border-soft:#1d2532;
  --text:#e9edf4; --text-dim:#8b95a8; --text-faint:#5b6577;
  --accent:#5b8def; --accent-soft:rgba(91,141,239,.16);
  --interest:#e0796a; --interest-soft:rgba(224,121,106,.15);
  --principal:#48b586; --principal-soft:rgba(72,181,134,.15);
  --planned:#9b7ee8; --planned-soft:rgba(155,126,232,.16);
  --confirmed:#3fb6b0; --confirmed-soft:rgba(63,182,176,.16);
  --forgone:#dba43e; --forgone-soft:rgba(219,164,62,.15);
  --danger:#e0605a;
}
:root[data-theme="light"]{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f7f8fb; --surface-3:#edf0f5;
  --border:#e0e4ea; --border-soft:#eceff3;
  --text:#161b22; --text-dim:#5f6b7d; --text-faint:#8b95a8;
  --accent:#3868d6; --accent-soft:rgba(56,104,214,.10);
  --interest:#c1543f; --interest-soft:rgba(193,84,63,.10);
  --principal:#1c8f63; --principal-soft:rgba(28,143,99,.10);
  --planned:#7a5cc9; --planned-soft:rgba(122,92,201,.10);
  --confirmed:#1f8f8a; --confirmed-soft:rgba(31,143,138,.10);
  --forgone:#a9762a; --forgone-soft:rgba(169,118,42,.10);
  --danger:#c1423a;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%; overflow:hidden; background:var(--bg);}
.stage{
  height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 55%),
    var(--bg);
  font-family:var(--font-ui); color:var(--text); padding:16px;
}
.phone{
  width:402px; max-width:100%; height:min(854px, 96vh); background:var(--surface);
  border-radius:44px; border:1px solid var(--border); box-shadow:0 30px 80px -20px rgba(0,0,0,.5), 0 0 0 8px color-mix(in srgb, var(--bg) 60%, black 10%);
  overflow:hidden; display:flex; flex-direction:column; position:relative;
}
.screen{ flex:1; overflow-y:auto; overflow-x:hidden; padding:18px 18px 8px; position:relative; }
.screen::-webkit-scrollbar{width:0;}
.header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; min-height:32px;}
.header-sticky{ display:flex; align-items:center; justify-content:space-between; position:sticky; top:-18px; margin:-18px -18px 16px; padding:16px 18px 12px; background:var(--surface); z-index:15; border-bottom:1px solid var(--border-soft);}
.plan-trigger{ justify-self:end; display:flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); border:none; padding:7px 13px; border-radius:100px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--font-ui); white-space:nowrap;}
.link-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; margin:14px 0 18px;}
.link-grid .link{font-size:13px;}
.link-grid span:nth-child(1){text-align:left;}
.link-grid span:nth-child(2){text-align:center;}
.link-grid span:nth-child(3){text-align:right;}
.link-grid.cols4{ grid-template-columns:1fr 1fr 1fr 1fr;}
.link-grid .subval{ font-size:11px; margin-top:2px;}
.amort-window{ max-height:400px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm); margin-top:4px;}
.amort-jump{ display:flex; background:var(--surface-3); border-radius:var(--radius-sm); padding:3px; gap:2px; margin-top:10px;}
.amort-jump button{ flex:1; border:none; background:none; padding:8px 4px; border-radius:9px; font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer; font-family:var(--font-ui);}
.amort-jump button.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.15);}
.header h1{ font-size:22px; margin:0; letter-spacing:-.01em; font-weight:700;}
.back{ display:flex; align-items:center; gap:4px; color:var(--accent); font-size:15px; font-weight:600; cursor:pointer; background:none; border:none; font-family:var(--font-ui); padding:4px 0;}
.iconbtn{ width:32px;height:32px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;}
.link{ color:var(--accent); font-weight:600; font-size:15px; background:none;border:none;cursor:pointer;font-family:var(--font-ui);}
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.section-label{ text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--text-dim); font-weight:700; margin:22px 0 8px; }
.section-label:first-child{margin-top:0;}
.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.stat-pill{ background:var(--surface-3); border-radius:var(--radius-sm); padding:10px 6px; text-align:center;}
.stat-pill .v{ font-size:16px; font-weight:700; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.stat-pill .l{ font-size:10.5px; color:var(--text-dim); margin-top:2px;}
.big-number{ font-size:34px; font-weight:700; font-family:var(--font-mono); letter-spacing:-.02em;}
.dim{ color:var(--text-dim); }
.faint{color:var(--text-faint);}
.sort-row{ display:flex; gap:8px; margin:16px 0 12px; overflow-x:auto; padding-bottom:2px;}
.chip{ flex:0 0 auto; padding:7px 13px; border-radius:100px; background:var(--surface-2); border:1px solid var(--border); font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer; white-space:nowrap;}
.chip.active{ background:var(--accent); color:white; border-color:var(--accent);}
.chip.iconchip{padding:7px 9px;}
.prop-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:15px; margin-bottom:12px; cursor:pointer; transition:border-color .15s;}
.prop-card:active{ border-color:var(--accent);}
.prop-top{ display:flex; justify-content:space-between; align-items:baseline;}
.prop-name{ font-size:16.5px; font-weight:700;}
.prop-sub{ font-size:12.5px; color:var(--text-dim); margin-top:1px;}
.prop-balance{ font-size:17px; font-weight:700; font-family:var(--font-mono);}
.prop-meta{ font-size:12.5px; color:var(--text-dim); text-align:right; margin-top:1px; font-family:var(--font-mono);}
.progress-track{ height:6px; border-radius:4px; background:var(--surface-3); margin:12px 0 12px; overflow:hidden;}
.progress-fill{ height:100%; background:var(--principal); border-radius:4px;}
.prop-metrics{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.metric{ }
.metric .v{ font-size:14px; font-weight:700; font-family:var(--font-mono);}
.metric .l{ font-size:10.5px; color:var(--text-dim); margin-top:1px;}
.metric.interest .v{color:var(--interest);}
.metric.principal .v{color:var(--principal);}
.metric.ip .v{color:var(--accent);}
.subloan-list{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
.subloan-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; color:var(--text-dim);}
.subloan-row b{color:var(--text); font-weight:600; font-family:var(--font-mono);}
.tabbar{ display:flex; border-top:1px solid var(--border); background:var(--surface); padding:8px 8px 14px;}
.tabbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); background:none;border:none; font-family:var(--font-ui); font-size:10.5px; font-weight:600; cursor:pointer; padding:4px;}
.tabbtn.active{ color:var(--accent);}
.tabbtn svg{width:22px;height:22px;}
.sheet-layer{ position:absolute; inset:0; z-index:30; pointer-events:none;}
.overlay{ position:absolute; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; z-index:20; animation:fadein .15s ease; pointer-events:auto;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{ background:var(--surface); border-radius:26px 26px 0 0; border:1px solid var(--border); width:100%; max-height:88%; overflow-y:auto; padding:16px 18px 26px; animation:slideup .18s ease;}
@keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.az-sticky{ position:sticky; top:-16px; margin:-16px -18px 14px; padding:16px 18px 14px; background:var(--surface); z-index:5; border-bottom:1px solid var(--border-soft); border-radius:26px 26px 0 0;}
.sheet-head h2{font-size:17px;margin:0;}
.row-line{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border-soft);}
.row-line:last-child{border-bottom:none;}
.row-line .l{font-size:14px; color:var(--text-dim);}
.row-line .v{font-size:14.5px; font-weight:600; font-family:var(--font-mono);}
.cost-row{ padding:11px 0; border-bottom:1px solid var(--border-soft);}
.cost-row .top{ display:flex; justify-content:space-between; align-items:center;}
.cost-row .l{font-size:14px; color:var(--text-dim);}
.cost-row .v{font-size:14.5px; font-weight:600; font-family:var(--font-mono);}
.cost-row .asof{ display:flex; justify-content:flex-end; align-items:center; gap:6px; font-size:10.5px; color:var(--text-faint); margin-top:5px;}
.cost-row .asof input{ background:var(--surface-3); border:1px solid var(--border); border-radius:6px; padding:3px 7px; font-family:var(--font-mono); font-size:10.5px; color:var(--text); outline:none;}
.legend-box{ background:var(--surface-3); border-radius:var(--radius-sm); padding:10px 12px; font-size:11.5px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
.legend-box p{margin:0;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.input-row{ display:flex; align-items:center; gap:8px; background:var(--surface-3); border-radius:var(--radius-sm); padding:11px 13px;}
.input-row input{ flex:1; background:none; border:none; color:var(--text); font-family:var(--font-mono); font-size:16px; font-weight:700; outline:none; width:0;}
.input-row .suffix{color:var(--text-dim); font-size:13px;}
.btn-row{display:flex; gap:8px; margin-top:12px;}
.btn{ flex:1; padding:11px; border-radius:var(--radius-sm); text-align:center; font-size:13.5px; font-weight:700; cursor:pointer; border:1px solid transparent;}
.btn-planned{ background:var(--planned-soft); color:var(--planned); border-color:color-mix(in srgb, var(--planned) 40%, transparent);}
.btn-confirm{ background:var(--confirmed-soft); color:var(--confirmed); border-color:color-mix(in srgb, var(--confirmed) 40%, transparent);}
.btn-ghost-sm{ background:var(--surface-3); color:var(--text-dim); border:none; padding:6px 11px; border-radius:9px; font-size:12px; font-weight:600; cursor:pointer; font-family:var(--font-ui);}
.btn-primary{background:var(--accent); color:white;}
.callout{ border-radius:var(--radius-sm); padding:12px 13px; font-size:13px; margin-top:10px; font-weight:600;}
.callout.good{background:var(--confirmed-soft); color:var(--confirmed);}
.callout.planned{background:var(--planned-soft); color:var(--planned);}
.big-stat{ text-align:center; padding:14px 10px; border-radius:var(--radius-sm);}
.big-stat .v{ font-size:26px; font-weight:700; font-family:var(--font-mono);}
.big-stat .l{ font-size:11px; color:var(--text-dim); margin-top:4px; text-transform:uppercase; letter-spacing:.05em;}
.decision-box{ background:var(--accent-soft); border-radius:var(--radius-sm); padding:14px 15px; font-size:14px; line-height:1.5; color:var(--text); margin-top:14px;}
.decision-box.negative{ background:var(--interest-soft); }
.decision-box b{ font-weight:700; }
.marginal-line{ font-size:12.5px; color:var(--text-dim); margin-top:8px; line-height:1.5;}
.legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11px; color:var(--text-dim);}
.impact-block{ background:var(--surface-3); border-radius:var(--radius-sm); padding:12px 14px; margin-top:12px;}
.impact-row{ display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--border-soft);}
.impact-row:last-of-type{ border-bottom:none;}
.impact-row .label{ font-size:12.5px; color:var(--text-dim);}
.impact-row .value{ font-family:var(--font-mono); font-weight:700; font-size:14px; white-space:nowrap;}
.impact-row .arrow{ color:var(--text-faint); font-weight:400; margin:0 2px;}
.impact-summary{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-soft); font-size:13px; font-weight:700; color:var(--planned);}
.info-btn{ width:20px; height:20px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:11px; font-weight:700; font-style:italic; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; padding:0;}
.entry-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--border-soft);}
.entry-row:last-child{border-bottom:none;}
.entry-badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:.03em;}
.entry-badge.planned{background:var(--planned-soft); color:var(--planned);}
.entry-badge.confirmed{background:var(--confirmed-soft); color:var(--confirmed);}
.entry-actions{display:flex; gap:6px;}
.entry-actions button{background:none; border:none; color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; font-family:var(--font-ui); padding:4px 2px;}
.entry-actions button.danger{color:var(--danger);}
.seg{ display:flex; background:var(--surface-3); border-radius:var(--radius-sm); padding:3px; gap:2px;}
.seg button{ flex:1; border:none; background:none; padding:8px 4px; border-radius:9px; font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer; font-family:var(--font-ui);}
.seg button.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.15);}
table.amort{ width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; margin-top:10px; color:var(--text);}
table.amort th{ text-align:right; font-family:var(--font-ui); font-weight:600; color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:6px 4px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface-2);}
table.amort th:first-child, table.amort td:first-child{text-align:left;}
table.amort td{ padding:7px 4px; text-align:right; border-bottom:1px solid var(--border-soft); }
table.amort tr.state-confirmed td{ background:var(--confirmed-soft); }
table.amort tr.state-planned td{ background:var(--planned-soft); }
table.amort tr.state-current td{ background:var(--accent-soft); font-weight:700;}
table.amort td.i{color:var(--interest);} table.amort td.p{color:var(--principal);}
.scrollx{overflow-x:auto;}
.badge{ font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:100px; }
.badge.watching{background:var(--accent-soft); color:var(--accent);}
.badge.draft{background:var(--surface-3); color:var(--text-dim);}
.badge.purchased{background:var(--principal-soft); color:var(--principal);}
.samplebar{ background:var(--planned-soft); color:var(--planned); font-size:11.5px; font-weight:700; text-align:center; padding:7px; border-radius:10px; margin-bottom:14px; letter-spacing:.02em;}
.list-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 15px; margin-bottom:11px; cursor:pointer;}
.settings-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border-soft);}
.settings-row:last-child{border-bottom:none;}
.settings-row .l{font-size:14.5px;}
.settings-row .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.toggle{ width:44px; height:26px; border-radius:14px; background:var(--surface-3); position:relative; cursor:pointer; border:1px solid var(--border); flex:0 0 auto;}
.toggle.on{background:var(--accent); border-color:var(--accent);}
.toggle .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:white; transition:left .15s;}
.toggle.on .knob{left:20px;}
.selectchip{font-size:13px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:6px 11px; border-radius:9px; cursor:pointer; border:none; font-family:var(--font-ui);}
.footnote{font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-top:14px;}
details.footnote, details.legend-box{ margin-top:6px; }
details.footnote summary.info-btn, details.legend-box summary.info-btn{ list-style:none; }
details.footnote summary.info-btn::-webkit-details-marker, details.legend-box summary.info-btn::-webkit-details-marker{ display:none; }
details.footnote .footnote-body{ margin-top:8px; }
details.legend-box{ background:none; padding:0; }
details.legend-box[open]{ background:var(--surface-3); border-radius:var(--radius-sm); padding:10px 12px;}
details.legend-box p{ margin:8px 0 0; }
::selection{background:var(--accent-soft);}
.slider{-webkit-appearance:none; width:100%; height:4px; border-radius:4px; background:var(--surface-3); outline:none; margin:14px 0 6px;}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:18px;height:18px;border-radius:50%;background:var(--accent); cursor:pointer;}
.az-section{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
.az-section-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; font-size:14px; font-weight:600;}
.az-chevron{ display:inline-block; color:var(--text-dim); margin-right:8px; font-size:11px;}
.az-section-summary{ font-size:12.5px; color:var(--text-dim); font-weight:500; font-family:var(--font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.az-section-body{ padding:2px 15px 15px;}
@media (max-width:480px){
  .stage{ height:auto; min-height:0; padding:10px; }
  .phone{ width:100%; max-width:460px; height:760px; max-height:none; border-radius:26px; }
}
</style>
</head>
<body>


<div class="stage">
  <div class="phone">
    <div class="screen" id="screen"></div>
    <div class="tabbar" id="tabbar"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
  </div>
</div>

<script>
let THEME = 'dark';
function setTheme(t){
  THEME = t || 'system';
  if(t){ document.documentElement.setAttribute('data-theme',t); } else { document.documentElement.removeAttribute('data-theme'); }
  try{ localStorage.setItem('mortgageAppTheme', THEME); }catch(e){}
  if(typeof render==='function') render();
}
(function(){
  let saved=null;
  try{ saved = localStorage.getItem('mortgageAppTheme'); }catch(e){}
  THEME = saved || 'dark';
  if(THEME!=='system') document.documentElement.setAttribute('data-theme', THEME);
})();

/* ============ INVESTMENTS (real balances/rates, manually reconciled) ============ */
let _nextInvId = 1;
let _nextInvEventId = 1;
const investments = [
  { id:'inv-sample-mm', name:'Money Market (sample)', isSample:true, balance:50000, rate:4.5, rateDate:null, balanceDate:null, events:[] },
  { id:'inv-sample-brk', name:'Brokerage (sample)', isSample:true, balance:25000, rate:7.0, rateDate:null, balanceDate:null, events:[] },

function invMonthlyReturn(inv){ return (inv.balance||0) * (inv.rate||0)/100/12; }
function newInvId(){ return 'inv'+(_nextInvId++); }
function newInvEventId(){ return 'ie'+(_nextInvEventId++); }
function findInvestment(id){ return investments.find(i=>i.id===id); }
function invEventSign(type){ return (type==='deposit'||type==='transfer_in') ? 1 : -1; }
/* Future-dated events (planned or locked-in) aren't reflected in inv.balance yet —
   only past/today events are, since those touch the real balance immediately on entry.
   Interest compounds by default (walked month by month) since that's the normal case —
   an explicit withdrawal event is what represents pulling earnings out instead of letting them ride. */
function invBalanceAtDate(inv, date){
  let bal = inv.balance||0;
  if(date<=TODAY) return bal;
  // start the walk at TODAY+1 — anything dated TODAY or earlier already mutated inv.balance directly at entry time,
  // so re-applying it here would double-count it.
  let cursor = addM(TODAY, 1);
  while(cursor<=date){
    (inv.events||[]).forEach(e=>{
      if(mkey(parseD(e.date))===mkey(cursor)) bal += invEventSign(e.type)*e.amount;
    });
    if(inv.recurring && inv.recurring.amount>0 && cursor>=parseD(inv.recurring.startDate)) bal += (inv.recurring.direction==='debit'?-1:1)*inv.recurring.amount;
    bal = Math.max(0, bal);
    if(cursor<date) bal += bal*(inv.rate||0)/100/12; // compound this month's interest before moving on, unless this IS the target month
    cursor = addM(cursor,1);
  }
  return Math.max(0, bal);
}
/* Single-pass version of the above, for building an entire month-by-month series efficiently
   (calling invBalanceAtDate per-cell would be O(months^2) — fine at 24 months, not at 600). */
function invMonthlyReturnSeries(inv, monthsCount){
  const series = [];
  let bal = inv.balance||0;
  for(let i=0;i<monthsCount;i++){
    const date = addM(TODAY, i);
    if(i>0){
      (inv.events||[]).forEach(e=>{
        if(mkey(parseD(e.date))===mkey(date)) bal += invEventSign(e.type)*e.amount;
      });
      if(inv.recurring && inv.recurring.amount>0 && date>=parseD(inv.recurring.startDate)) bal += (inv.recurring.direction==='debit'?-1:1)*inv.recurring.amount;
      bal = Math.max(0, bal);
    }
    series.push(bal*(inv.rate||0)/100/12);
    bal += bal*(inv.rate||0)/100/12;
  }
  return series;
}
function invMonthlyReturnAtDate(inv, date){ return invBalanceAtDate(inv, date) * (inv.rate||0)/100/12; }
function invCellEvents(inv, dateStr){ return (inv.events||[]).filter(e=>e.date===dateStr); }
const INV_SCHEDULE_MONTHS = 240; // 20 years — long enough to see an account roughly double at typical rates
function invGrowthSchedule(inv){
  const rows = [];
  for(let i=0;i<INV_SCHEDULE_MONTHS;i++){
    const date = addM(TODAY, i);
    const balance = invBalanceAtDate(inv, date); // this month's starting point (after this month's own events/recurring, before this month's interest)
    const interest = balance*(inv.rate||0)/100/12;
    let added = 0;
    if(i>0){
      invCellEvents(inv, mkey(date)+'-01').forEach(e=>{ added += invEventSign(e.type)*e.amount; });
      if(inv.recurring && inv.recurring.amount>0 && date>=parseD(inv.recurring.startDate)) added += (inv.recurring.direction==='debit'?-1:1)*inv.recurring.amount;
    }
    rows.push({ date, balance, interest, added });
  }
  return rows;
}
function invDoublingRow(rows, startBalance){
  if(startBalance<=0) return null;
  return rows.find(r=>(r.balance+r.interest)>=startBalance*2) || null;
}

/* ============ AMORTIZATION ENGINE ============ */
function parseD(s){ const [y,m]=s.split('-').map(Number); return new Date(y,m-1,1); }
function addM(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function mkey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function pmtFor(loan){ const r=loan.rate/100/12; return loan.original*r/(1-Math.pow(1+r,-loan.term)); }

function buildSchedule(loan){
  const r = loan.rate/100/12, pmt = pmtFor(loan);
  const start = parseD(loan.start);
  const extrasByKey = {};
  (loan.confirmedExtras||[]).forEach(e=>{ const k=mkey(parseD(e.date)); extrasByKey[k]=(extrasByKey[k]||0)+e.amount; });
  let balance = loan.original; const rows=[];
  for(let k=1;k<=loan.term+3;k++){
    if(balance<=0.01) break;
    const date = addM(start,k-1);
    const interest = balance*r;
    let principal = pmt-interest;
    const recurStart = loan.recurringExtraFrom ? parseD(loan.recurringExtraFrom) : start;
    let extra = (extrasByKey[mkey(date)]||0) + (loan.recurringExtra && date>=recurStart ? loan.recurringExtra : 0);
    if(principal+extra>=balance){ if(principal>=balance){principal=balance;extra=0;} else {extra=balance-principal;} }
    balance = Math.max(0, balance-principal-extra);
    rows.push({period:k,date,interest,principal,extra,balance,state:date<TODAY?'past':(mkey(date)===mkey(TODAY)?'current':'scheduled')});
  }
  return {pmt, r, rows};
}
const SCHED = {};
function scheduleFor(id){ if(!SCHED[id]) SCHED[id]=buildSchedule(findLoan(id)); return SCHED[id]; }
const SCHED_INDEX = {};
function scheduleRowAtDate(loanId, date){
  if(!SCHED_INDEX[loanId]){
    const idx = {};
    scheduleFor(loanId).rows.forEach(r=>{ idx[mkey(r.date)]=r; });
    SCHED_INDEX[loanId] = idx;
  }
  return SCHED_INDEX[loanId][mkey(date)] || null;
}
function findLoan(id){ for(const p of properties) for(const l of allLoansOf(p)) if(l.id===id) return l; const sl=findStandaloneLoan(id); if(sl) return sl; return null; }
function findProperty(id){
  const direct = properties.find(p=>p.id===id);
  if(direct) return direct;
  for(const p of properties){
    const loan = (p.otherLoans||[]).find(l=>l.id===id);
    if(loan) return { id:loan.id, name:loan.label.split(' note')[0], type:'Remodel loan &middot; '+p.name, note:null, loans:[loan], isStandaloneLoan:true };
  }
  const sl = findStandaloneLoan(id);
  if(sl) return { id:sl.id, name:sl.label||'New loan', type:'Loan', note:null, loans:[sl], isStandaloneLoan:true, committed:sl.committed!==false };
  return null;
}
function idxCurrent(rows){ return rows.findIndex(r=>mkey(r.date)===mkey(TODAY)); }
function currentRow(id){ const {rows}=scheduleFor(id); return rows[idxCurrent(rows)]; }
function yearsLeft(id){ const {rows}=scheduleFor(id); return (rows.length-idxCurrent(rows))/12; }
function originalLifetimeInterest(loan){ const pmt=pmtFor(loan); return pmt*loan.term-loan.original; }
function paidToDate(id){ const {rows}=scheduleFor(id); const idx=idxCurrent(rows); let s=0; for(let i=0;i<=idx;i++) s+=rows[i].interest; return s; }
function remainingProjected(id){ const {rows}=scheduleFor(id); const idx=idxCurrent(rows); let s=0; for(let i=idx+1;i<rows.length;i++) s+=rows[i].interest; return s; }

function propertyOtherBalance(prop){ return (prop.otherLoans||[]).reduce((s,l)=>s+currentRow(l.id).balance,0); }
function propertyCurrent(prop){
  const primary = prop.loans[0];
  const prow = currentRow(primary.id);
  const balance = prow.balance + propertyOtherBalance(prop);
  return {balance, interest:prow.interest, principal:prow.principal, rate:primary.rate, ip: prow.principal>0?prow.interest/prow.principal:0};
}
function propertyYearsLeft(prop){ return yearsLeft(prop.loans[0].id); }
function propertyOriginal(prop){ return allLoansOf(prop).reduce((s,l)=>s+l.original,0); }
function propertyProgress(prop){
  const orig = propertyOriginal(prop); const bal = propertyCurrent(prop).balance;
  return Math.max(0, Math.min(1, (orig-bal)/orig));
}
function unitRentAtDate(u, date){
  let rent = u.rent;
  (u.increases||[]).slice().sort((a,b)=>parseD(a.date)-parseD(b.date)).forEach(inc=>{
    const start = parseD(inc.date);
    if(date < start) return;
    if(inc.recurring){
      const months = (date.getFullYear()-start.getFullYear())*12 + (date.getMonth()-start.getMonth());
      const times = Math.floor(months/12) + 1;
      rent = rent * Math.pow(1 + inc.pct/100, times);
    } else {
      rent = rent * (1 + inc.pct/100);
    }
  });
  return rent;
}
function propertyRevenueAtDate(prop, date){ return prop.units.reduce((s,u)=>s+unitRentAtDate(u,date),0); }
function propertyRevenue(prop){ return propertyRevenueAtDate(prop, TODAY); }
function propertyCustomCostsMonthly(prop){
  return (prop.customCosts||[]).reduce((s,c)=> s + (c.amount||0)*(FREQ_MULT[c.freq||'yearly'])/12, 0);
}
function propertyCosts(prop){
  const primary = prop.loans[0];
  const row = currentRow(primary.id);
  const pmt = row.interest+row.principal;
  const otherPmt = (prop.otherLoans||[]).reduce((s,l)=>{ const r=currentRow(l.id); return s+r.interest+r.principal; },0);
  const gross = propertyRevenue(prop);
  const pm = prop.nnn ? 0 : gross*(prop.pmPct/100);
  const taxes = prop.nnn ? 0 : (prop.taxesAnnual||0)/12;
  const insurance = prop.nnn ? 0 : (prop.insuranceAnnual||0)/12;
  const maintenance = prop.nnn ? 0 : gross*(prop.maintenancePct||0)/100;
  const custom = prop.nnn ? 0 : propertyCustomCostsMonthly(prop);
  return {pmt, otherPmt, pm, taxes, insurance, maintenance, custom, total: pmt+otherPmt+pm+taxes+insurance+maintenance+custom};
}
function propertyCashFlow(prop){ return propertyRevenue(prop) - propertyCosts(prop).total; }
function propertyCashFlowAtDate(prop, date){
  const primary = prop.loans[0];
  const prow = scheduleRowAtDate(primary.id, date);
  const pmt = prow ? prow.interest+prow.principal : 0;
  const otherPmt = (prop.otherLoans||[]).reduce((s,l)=>{
    const orow = scheduleRowAtDate(l.id, date);
    return s + (orow ? orow.interest+orow.principal : 0);
  },0);
  const gross = propertyRevenueAtDate(prop, date);
  const pm = prop.nnn ? 0 : gross*(prop.pmPct/100);
  const taxes = prop.nnn ? 0 : (prop.taxesAnnual||0)/12;
  const insurance = prop.nnn ? 0 : (prop.insuranceAnnual||0)/12;
  const maintenance = prop.nnn ? 0 : gross*(prop.maintenancePct||0)/100;
  const custom = prop.nnn ? 0 : propertyCustomCostsMonthly(prop);
  return gross - (pmt+otherPmt+pm+taxes+insurance+maintenance+custom);
}
/* ============ COMBINED RECEIVABLES (real estate + investments) ============ */
function standaloneLoanPayment(id){ const r=currentRow(id); return r? r.interest+r.principal : 0; }
function standaloneLoanPaymentAtDate(id, date){ const r=scheduleRowAtDate(id, date); return r? r.interest+r.principal : 0; }
function incomeSources(){
  const list = [];
  properties.forEach(p=> list.push({ id:'prop:'+p.id, kind:'property', name:p.name, sub:p.type, amount: propertyCashFlow(p) }));
  investments.forEach(inv=> { if(inv.committed===false) return; list.push({ id:'inv:'+inv.id, kind:'investment', name:inv.name, sub:inv.isSample?'Investment &middot; sample':'Investment', amount: invMonthlyReturn(inv) }); });
  standaloneLoans.forEach(l=> { if(l.committed===false) return; list.push({ id:'loan:'+l.id, kind:'loan', name:l.label, sub:'Loan payment', amount: -standaloneLoanPayment(l.id) }); });
  return list;
}
function incomeSourceAtDate(src, date){
  if(src.kind==='property') return propertyCashFlowAtDate(findProperty(src.id.slice(5)), date);
  if(src.kind==='loan') return -standaloneLoanPaymentAtDate(src.id.slice(5), date);
  return invMonthlyReturnAtDate(findInvestment(src.id.slice(4)), date);
}
function incomeTotalAtDate(date){ return incomeSources().reduce((s,src)=>s+incomeSourceAtDate(src,date),0); }
function portfolioTotals(){
  let balance=0, interest=0, principal=0;
  properties.forEach(p=>{ allLoansOf(p).forEach(l=>{ const row=currentRow(l.id); balance+=row.balance; interest+=row.interest; principal+=row.principal; }); });
  return {balance, interest, principal, ip: interest/principal};
}
function portfolioYearsLeft(weighted){
  let wsum=0,bsum=0,list=[];
  properties.forEach(p=>{ const c=propertyCurrent(p); const yl=propertyYearsLeft(p); wsum+=c.balance*yl; bsum+=c.balance; list.push(yl); });
  if(!weighted) return list.reduce((a,b)=>a+b,0)/list.length;
  return wsum/bsum;
}

/* ============ LOCAL PERSISTENCE + EXPORT/IMPORT ============ */
const FINAPP_STORAGE_KEY = 'finapp-data-v1';
function saveLocalData(){
  try{
    const payload = { version:1, properties, investments, analyzerSamples, standaloneLoans, settings: state.settings, lastSyncAt: state.lastSyncAt||null };
    localStorage.setItem(FINAPP_STORAGE_KEY, JSON.stringify(payload));
  }catch(e){}
}
function loadLocalData(){
  try{
    const raw = localStorage.getItem(FINAPP_STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(Array.isArray(data.properties)) properties.splice(0, properties.length, ...data.properties);
    if(Array.isArray(data.investments)) investments.splice(0, investments.length, ...data.investments);
    if(Array.isArray(data.analyzerSamples)) analyzerSamples.splice(0, analyzerSamples.length, ...data.analyzerSamples);
    if(Array.isArray(data.standaloneLoans)) standaloneLoans.splice(0, standaloneLoans.length, ...data.standaloneLoans);
    if(data.settings) Object.assign(state.settings, data.settings);
    if(data.lastSyncAt) state.lastSyncAt = data.lastSyncAt;
  }catch(e){}
}
function fmtDateTime(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function exportData(){
  const payload = { version:1, properties, investments, analyzerSamples, standaloneLoans, settings: state.settings, exportedAt: new Date().toISOString() };
  state.lastSyncAt = payload.exportedAt;
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'finapp-data-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  render();
}
function triggerImport(){ const el=document.getElementById('importFileInput'); if(el) el.click(); }
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(Array.isArray(data.properties)) properties.splice(0, properties.length, ...data.properties);
      if(Array.isArray(data.investments)) investments.splice(0, investments.length, ...data.investments);
      if(Array.isArray(data.analyzerSamples)) analyzerSamples.splice(0, analyzerSamples.length, ...data.analyzerSamples);
      if(Array.isArray(data.standaloneLoans)) standaloneLoans.splice(0, standaloneLoans.length, ...data.standaloneLoans);
      if(data.settings) Object.assign(state.settings, data.settings);
      state.lastSyncAt = data.exportedAt || new Date().toISOString();
      for(const k in SCHED) delete SCHED[k];
      for(const k in SCHED_INDEX) delete SCHED_INDEX[k];
      render();
      alert('Imported successfully.');
    }catch(err){
      alert('Could not read that file — make sure it\'s a FinApp export (.json).');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function render(){
  const screen = document.getElementById('screen');
  const tabbar = document.getElementById('tabbar');
  const sheetLayer = document.getElementById('sheetLayer');
  let html = '';
  if(state.pushed){
    if(state.pushed.type==='loan') html = renderLoanDetail(state.pushed.id);
    if(state.pushed.type==='allocate') html = renderAllocateDetail();
    if(state.pushed.type==='settings') html = renderSettings();
    if(state.pushed.type==='prepay') html = renderPrepayAnalysis();
    if(state.pushed.type==='investment') html = renderInvestmentDetail(state.pushed.id);
    tabbar.style.display='none';
  } else {
    tabbar.style.display='flex';
    if(state.tab==='portfolio') html = renderPortfolio();
    if(state.tab==='income') html = renderIncome();
    if(state.tab==='analyzer') html = renderAnalyzerLibrary();
    /* 'goals' tab temporarily removed from the tabbar per user request — renderGoalsPlaceholder() left intact below for easy restore */
  }
  const prevScroll = state._resetScroll ? 0 : screen.scrollTop;
  state._resetScroll = false;

  const active = document.activeElement;
  let focusInfo = null;
  if(active && active.id && (active.tagName==='INPUT' || active.tagName==='TEXTAREA')){
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
  }
  const prevSheetEl = sheetLayer.querySelector('.sheet');
  const prevSheetScroll = prevSheetEl ? prevSheetEl.scrollTop : 0;

  screen.innerHTML = html;
  sheetLayer.innerHTML = state.sheet ? renderSheet() : '';
  sheetLayer.style.pointerEvents = state.sheet ? 'auto' : 'none';
  screen.scrollTop = prevScroll;
  const newSheetEl = sheetLayer.querySelector('.sheet');
  if(newSheetEl) newSheetEl.scrollTop = prevSheetScroll;

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(el.type!=='number' && typeof focusInfo.start==='number'){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
  renderTabbar();
  if(state.pushed && state.pushed.type==='loan') requestAnimationFrame(()=>jumpAmort('current', true));
  if(state.pushed && state.pushed.type==='investment') requestAnimationFrame(()=>jumpInvSchedule('current'));
  saveLocalData();
}
function renderTabbar(){
  const tabbar=document.getElementById('tabbar');
  if(state.pushed){ tabbar.innerHTML=''; return; }
  const tabs=[['income','coin','Income'],['portfolio','home','Portfolio'],['analyzer','chart','Analyzer']];
  tabbar.innerHTML = tabs.map(([id,icon,label])=>
    `<button class="tabbtn ${state.tab===id?'active':''}" onclick="goTab('${id}')">${tabIcon(icon)}<span>${label}</span></button>`

/* ============ WHERE SHOULD THE CASH GO? ============ */
function allocationLoans(){
  const list = [];
  properties.forEach(p=>{
    list.push({ loan:p.loans[0], displayName:p.name, sub:p.type });
    (p.otherLoans||[]).forEach(l=>{ list.push({ loan:l, displayName:l.label.split(' note')[0], sub:'Remodel loan &middot; '+p.name }); });
  });
  return list;
}
function setAllocateCash(v){ state.allocateCash = Math.max(0, numFrom(v)); render(); }
function renderAllocateDetail(){
  const cash = state.allocateCash || 50000;
  const nextMonthStr = mkey(addM(TODAY,1))+'-01';
  const rows = allocationLoans().map(({loan, displayName, sub})=>{
    const cur = currentRow(loan.id);
    const currentIP = cur.principal>0 ? cur.interest/cur.principal : 0;
    const baseline = projectForward(loan.id, []);
    const scenario = cash>0 ? projectForward(loan.id, [{date:nextMonthStr, amount:cash}]) : baseline;
    const idx = idxCurrent(scheduleFor(loan.id).rows);
    const monthsSaved = baseline.length - scenario.length;
    let a=0,b=0;
    for(let i=idx+1;i<baseline.length;i++) a+=baseline[i].interest;
    for(let i=idx+1;i<scenario.length;i++) b+=scenario[i].interest;
    const interestSaved = a-b;
    const nextRow = scenario[idx+1];
    const newIP = nextRow && nextRow.principal>0 ? nextRow.interest/nextRow.principal : currentIP;
    return {displayName, sub, balance:cur.balance, currentIP, newIP, monthsSaved, interestSaved};
  }).sort((a,b)=>b.monthsSaved-a.monthsSaved);

  return `
  <div class="header-sticky"><button class="back" onclick="goBack()">&lsaquo; ${backLabel()}</button></div>
  <h1 style="font-size:20px; margin:0 0 4px;">Where Should the Cash Go?</h1>

    <div class="dim" style="font-size:12px; margin-bottom:2px;">Cash available to deploy</div>
    <div class="input-row"><span class="suffix">$</span><input id="in-allocate-cash" type="text" inputmode="decimal" value="${rv('in-allocate-cash',cash)}" oninput="RAW['in-allocate-cash']=this.value; setAllocateCash(this.value)"/></div>
  </div>
  ${rows.map(r=>`
  <div class="card" style="margin-bottom:12px; padding:14px 16px;">
    <div class="prop-top" style="margin-bottom:10px;">
      <div><div class="prop-name" style="font-size:15px;">${r.displayName}</div><div class="prop-sub">${r.sub}</div></div>
      <div style="text-align:right;"><div class="prop-balance" style="font-size:15px;">${fmt$(r.balance)}</div></div>
    </div>
    <div class="prop-metrics">
      <div class="metric ip"><div class="v" style="font-size:13px;">${fmtRatio(r.currentIP)} &rarr; ${fmtRatio(r.newIP)}</div><div class="l">I/P now &rarr; after</div></div>
      <div class="metric"><div class="v" style="color:var(--confirmed)">${r.monthsSaved} mo</div><div class="l">Time saved</div></div>
      <div class="metric principal"><div class="v">${fmt$(r.interestSaved)}</div><div class="l">Interest saved</div></div>
    </div>
  </div>`).join('')}
  <details class="footnote" style="margin-bottom:6px;"><summary class="info-btn">&#9432;</summary><div class="footnote-body">Each row models applying the full amount as a one-time payment next month to that loan alone, on top of anything already planned or locked in &mdash; nothing here is saved automatically. Open a loan's own planner to actually commit it.</div></details>
  `;
}

let _nextExtraId = 1;
function newExtraId(){ return 'x'+(_nextExtraId++); }
let _nextCustomCostId = 1;
function plannerFor(propId){ if(!state.planner[propId]) state.planner[propId]={amount:0, date: mkey(addM(TODAY,1))+'-01', editing:null}; return state.planner[propId]; }

function projectForward(loanId, plannedExtras){
  const loan = findLoan(loanId);
  const base = scheduleFor(loanId);
  const idx = idxCurrent(base.rows);
  const rows = base.rows.slice(0, idx+1).map(r=>({...r}));
  let balance = rows[idx].balance;
  const r = base.r, pmt = base.pmt;
  const recurStart = loan.recurringExtraFrom ? parseD(loan.recurringExtraFrom) : parseD(loan.start);
  const confirmedByKey = {};
  (loan.confirmedExtras||[]).forEach(e=>{ const k=mkey(parseD(e.date)); confirmedByKey[k]=(confirmedByKey[k]||0)+e.amount; });
  const plannedByKey = {};
  (plannedExtras||[]).forEach(e=>{ const k=mkey(parseD(e.date)); plannedByKey[k]=(plannedByKey[k]||0)+e.amount; });
  let k = idx+2, date = addM(TODAY,1), steps=0;
  while(balance>0.01 && steps<600){
    const interest = balance*r;
    let principal = pmt-interest;
    const confirmedExtra = (confirmedByKey[mkey(date)]||0) + (loan.recurringExtra && date>=recurStart ? loan.recurringExtra : 0);
    const plannedExtra = plannedByKey[mkey(date)]||0;
    let extra = confirmedExtra + plannedExtra;
    if(principal+extra>=balance){ if(principal>=balance){principal=balance;extra=0;} else {extra=balance-principal;} }
    balance = Math.max(0, balance-principal-extra);
    const st = plannedExtra>0.005 ? 'planned' : (confirmedExtra>0.005 ? 'confirmed' : 'scheduled');
    rows.push({period:k, date, interest, principal, extra, balance, state:st});
    k++; date=addM(date,1); steps++;
  }
  return rows;
}

function plannerMetrics(propId){
  const prop = findProperty(propId);
  const draft = plannerFor(propId);
  const primaryLoan = prop.loans[0];
  const plannedList = primaryLoan.plannedExtras || [];
  const draftEntry = draft.amount>0 ? [{date:draft.date, amount:draft.amount}] : [];
  const baseline = projectForward(primaryLoan.id, []);
  const scenario = projectForward(primaryLoan.id, [...plannedList, ...draftEntry]);
  const idx = idxCurrent(scheduleFor(primaryLoan.id).rows);
  const monthsSaved = baseline.length - scenario.length;
  let a=0,b=0;
  for(let i=idx+1;i<baseline.length;i++) a+=baseline[i].interest;
  for(let i=idx+1;i<scenario.length;i++) b+=scenario[i].interest;
  const interestSaved = a-b;
  const hasPreview = plannedList.length>0 || draft.amount>0;
  const curRow = currentRow(primaryLoan.id);
  const currentIP = curRow.principal>0 ? curRow.interest/curRow.principal : 0;
  const previewDates = [...plannedList, ...draftEntry].map(e=>parseD(e.date));
  const latestDate = previewDates.length ? new Date(Math.max(...previewDates.map(d=>d.getTime()))) : null;
  const afterRow = latestDate ? scenario.find(r=>r.date>latestDate) : scenario[idx+1];
  const newIP = afterRow && afterRow.principal>0 ? afterRow.interest/afterRow.principal : currentIP;
  const payoffDate = scenario[scenario.length-1] ? scenario[scenario.length-1].date : baseline[baseline.length-1].date;
  const futureConfirmed = (primaryLoan.confirmedExtras||[]).filter(e=>e.id && parseD(e.date)>=TODAY);
  const yearsRemainingCurrent = (baseline.length-(idx+1))/12;
  const yearsRemainingNew = (scenario.length-(idx+1))/12;
  return {prop, draft, primaryLoan, baseline, scenario, idx, monthsSaved, interestSaved, currentIP, newIP, hasPreview, payoffDate, plannedList, futureConfirmed,
    yearsRemainingCurrent, yearsRemainingNew, interestRemainingCurrent:a, interestRemainingNew:b};
}

  push({type:'loan', id});

function loan_delete(id){
  const idx = standaloneLoans.findIndex(l=>l.id===id);
  if(idx>=0) standaloneLoans.splice(idx,1);
  goBack();
}
function loan_commit(id){
  const l = findStandaloneLoan(id);
  if(!l || !l.label.trim() || l.original<=0 || l.term<=0) return;
  l.committed = true;
  render();
}
function loan_set(id, field, val){
  const l = findStandaloneLoan(id);
  if(!l) return;
  if(field==='label') l.label = val;
  else if(field==='start'){ if(val) l.start = val+'-01'; }
  else l[field] = Math.max(0, numFrom(val));
  delete SCHED[id]; delete SCHED_INDEX[id];
  render();
}

  if(btn) btn.classList.add('active');
}

    ...pm.futureConfirmed.map(e=>({...e, list:'confirmed'}))

  return `<div class="overlay" onclick="if(event.target===this) closeSheet()"><div class="sheet">

function pl_setAmount(id,v){ plannerFor(id).amount = Math.max(0, numFrom(v)); render(); }
function pl_setDate(id,v){ if(v) plannerFor(id).date = v+'-01'; render(); }
function pl_save(propId, targetList){
  const draft = plannerFor(propId);
  if(draft.amount<=0) return;
  const prop = findProperty(propId); const loan = prop.loans[0];
  loan.plannedExtras = loan.plannedExtras||[];
  loan.confirmedExtras = loan.confirmedExtras||[];
  if(draft.editing){
    const srcArr = draft.editing.list==='planned' ? loan.plannedExtras : loan.confirmedExtras;
    const idx = srcArr.findIndex(e=>e.id===draft.editing.id);
    if(idx>=0) srcArr.splice(idx,1);
  }
  const entry = { id: draft.editing ? draft.editing.id : newExtraId(), date: draft.date, amount: draft.amount };
  (targetList==='planned' ? loan.plannedExtras : loan.confirmedExtras).push(entry);
  delete SCHED[loan.id]; delete SCHED_INDEX[loan.id];
  draft.amount=0; draft.date=mkey(addM(TODAY,1))+'-01'; draft.editing=null;
  render();
}
function pl_editEntry(propId, list, id){
  const prop = findProperty(propId); const loan = prop.loans[0];
  const arr = list==='planned' ? (loan.plannedExtras||[]) : (loan.confirmedExtras||[]);
  const entry = arr.find(e=>e.id===id);
  if(!entry) return;
  const draft = plannerFor(propId);
  draft.amount = entry.amount; draft.date = entry.date; draft.editing = {id, list};
  render();
}
function pl_deleteEntry(propId, list, id){
  const prop = findProperty(propId); const loan = prop.loans[0];
  const arr = list==='planned' ? loan.plannedExtras : loan.confirmedExtras;
  if(!arr) return;
  const idx = arr.findIndex(e=>e.id===id);
  if(idx>=0) arr.splice(idx,1);
  delete SCHED[loan.id]; delete SCHED_INDEX[loan.id];
  const draft = plannerFor(propId);
  if(draft.editing && draft.editing.id===id){ draft.amount=0; draft.date=mkey(addM(TODAY,1))+'-01'; draft.editing=null; }
  render();
}
function pl_cancelEdit(propId){
  const draft = plannerFor(propId);
  draft.amount=0; draft.date=mkey(addM(TODAY,1))+'-01'; draft.editing=null;
  render();
}

  { id:'sample1', kind:'property', name:'412 Aspen Ct', addr:'Sample listing &middot; not a real property', status:'watching', isSample:true, committed:true,
    price:525000, downMode:'%', downValue:25, loanAmount:0,

    units:1, bedroomsPerUnit:4, monthlyRent:3400, pmPct:10, taxMode:'$', taxValue:5775, insMode:'$', insValue:2200, maintenancePct:1.0 },
  { id:'sample2', kind:'property', name:'88 Larkspur Duplex', addr:'Sample listing &middot; not a real property', status:'draft', isSample:true, committed:true,
    price:640000, downMode:'%', downValue:20, loanAmount:0,
    rate:6.9, termYears:30,
    units:2, bedroomsPerUnit:3, monthlyRent:3000, pmPct:8, taxMode:'$', taxValue:7680, insMode:'$', insValue:2600, maintenancePct:1.2 },
  { id:'sample3', kind:'investment', name:'RILA (hypothetical)', status:'watching', isSample:true, committed:true,
    startBalance:100000, rate:10, monthlyContribution:0, horizonYears:10 },
];
const AZ_STATUSES = ['draft','watching','purchased'];
function analyzerCalc(p){
  const hasPrice = p.price>0;
  const downAmt = p.downMode==='%' ? p.price*p.downValue/100 : (p.downValue||0);
  const loanAmt = hasPrice ? Math.max(0, p.price-downAmt) : (p.loanAmount||0);
  const r = p.rate/100/12, n = Math.round((p.termYears||0)*12);
  const pmt = (loanAmt>0 && n>0) ? loanAmt*r/(1-Math.pow(1+r,-n)) : 0;
  const interest1 = loanAmt*r, principal1 = pmt-interest1;
  const taxBasis = hasPrice ? p.price : loanAmt;
  const taxesAnnual = p.taxMode==='%' ? taxBasis*p.taxValue/100 : p.taxValue;
  const insAnnual = p.insMode==='%' ? taxBasis*p.insValue/100 : p.insValue;
  const taxes = taxesAnnual/12;
  const insurance = insAnnual/12;
  const grossRent = p.monthlyRent*p.units;
  const pm = grossRent*(p.pmPct/100);
  const maintenance = taxBasis*p.maintenancePct/100/12;
  const expenses = taxes+insurance+pm+maintenance+pmt;
  const profit = grossRent-expenses;
  const totalBedrooms = p.units*(p.bedroomsPerUnit||0);
  const costsPerBedroom = totalBedrooms>0 ? expenses/totalBedrooms : null;
  return {loanAmt,pmt,interest1,principal1,taxes,insurance,pm,maintenance,grossRent,profit,expenses,totalBedrooms,costsPerBedroom, ip: principal1>0?interest1/principal1:0, hasPrice, downAmt};
}
/* Hypothetical investment scenario — separate from the real `investments` array on the Income tab.
   Flat rate + optional flat monthly contribution, compounded over a chosen horizon. */
function analyzerInvCalc(p){
  const monthly = (p.startBalance||0)*(p.rate||0)/100/12;
  const months = Math.round((p.horizonYears||0)*12);
  let bal = p.startBalance||0;
  for(let i=0;i<months;i++){
    bal += bal*(p.rate||0)/100/12;
    bal += (p.monthlyContribution||0);
  }
  const totalContributed = (p.startBalance||0) + (p.monthlyContribution||0)*months;
  return { monthly, projected:bal, totalContributed, growth:bal-totalContributed };
}
function analyzerInvSchedule(p){
  const months = Math.round((p.horizonYears||0)*12);
  const rows = [];
  let bal = p.startBalance||0;
  for(let i=0;i<months;i++){
    const interest = bal*(p.rate||0)/100/12;
    bal = bal+interest+(p.monthlyContribution||0);
    rows.push({ date:addM(TODAY,i+1), interest, added:(p.monthlyContribution||0), balance:bal });
  }
  return rows;
}
function az_toggleMode(id, modeField){
  const p = analyzerSamples.find(x=>x.id===id);
  if(!p) return;
  const c = analyzerCalc(p);
  const valueField = modeField==='taxMode' ? 'taxValue' : 'insValue';
  const basis = c.hasPrice ? p.price : c.loanAmt;
  const currentAnnual = p[modeField]==='%' ? basis*p[valueField]/100 : p[valueField];
  if(p[modeField]==='%'){ p[modeField]='$'; p[valueField]=Math.round(currentAnnual); }
  else { p[modeField]='%'; p[valueField] = basis>0 ? +(currentAnnual/basis*100).toFixed(2) : 0; }
  render();
}
function az_toggleDownMode(id){
  const p = analyzerSamples.find(x=>x.id===id);
  if(!p) return;
  const c = analyzerCalc(p);
  const currentAmt = c.downAmt;
  if(p.downMode==='%'){ p.downMode='$'; p.downValue=Math.round(currentAmt); }
  else { p.downMode='%'; p.downValue = p.price>0 ? +(currentAmt/p.price*100).toFixed(2) : 0; }
  render();
}
function az_scheduleRows(p, c){
  const rows = [];
  let balance = c.loanAmt;
  const r = p.rate/100/12;
  const n = Math.round((p.termYears||0)*12);
  for(let k=1;k<=n && balance>0.01;k++){
    const interest = balance*r;
    let principal = c.pmt-interest;
    if(principal>balance) principal = balance;
    balance = Math.max(0, balance-principal);
    rows.push({date:addM(TODAY,k-1), interest, principal, balance});
  }
  return rows;
}

/* ============ PAY DOWN DEBT OR INVEST? (merged from CAS prepayment prototype) ============ */
function cas_pmt(balance, ratePct, termMonths){
  const r = ratePct/100/12;
  if(termMonths<=0) return 0;
  if(r===0) return balance/termMonths;
  return balance*r/(1-Math.pow(1+r,-termMonths));
}
function cas_amortize(balance, ratePct, payment, maxMonths){
  const r = ratePct/100/12;
  const rows = [];
  let bal = balance;
  for(let m=1; m<=maxMonths; m++){
    if(bal<=0.01) break;
    const interest = bal*r;
    let principal = payment-interest;
    if(principal>bal) principal=bal;
    bal = Math.max(0, bal-principal);
    rows.push({month:m, interest, principal, balance:bal});
  }
  return rows;
}
function cas_monthlyRateFromAPY(apyPct){ return Math.pow(1+apyPct/100, 1/12)-1; }
function cas_investmentFV(principal, afterTaxApy, months){
  if(months<=0) return principal;
  const mr = cas_monthlyRateFromAPY(afterTaxApy);
  return principal*Math.pow(1+mr, months);
}
function cas_freedPaymentsFV(monthlyPayment, afterTaxApy, months){
  if(months<=0) return 0;
  const mr = cas_monthlyRateFromAPY(afterTaxApy);
  if(mr===0) return monthlyPayment*months;
  return monthlyPayment*((Math.pow(1+mr, months)-1)/mr);
}
function cas_horizonMonths(loanParams){
  const c = state.cas;
  if(c.horizonKey==='remaining') return loanParams.termMonths;
  if(c.horizonKey==='custom') return Math.max(1, Math.round(c.horizonYearsCustom*12));
  return Math.round(Number(c.horizonKey)*12);
}
function cas_analyze(loanParams, prepay, grossReturn){
  const balance = loanParams.balance, rate = loanParams.rate, termMonths = loanParams.termMonths;
  const payment = cas_pmt(balance, rate, termMonths);
  const afterTax = grossReturn*(1-state.cas.taxRate/100);
  const H = cas_horizonMonths(loanParams);

  const scheduleA = cas_amortize(balance, rate, payment, Math.max(termMonths, H)+2);
  const interestA_h = scheduleA.slice(0, H).reduce((s,r)=>s+r.interest,0);

  const prepayClamped = Math.max(0, Math.min(prepay, balance));
  const balanceAfterPrepay = balance - prepayClamped;
  const scheduleB = cas_amortize(balanceAfterPrepay, rate, payment, termMonths+2);
  const interestB_h = scheduleB.slice(0, H).reduce((s,r)=>s+r.interest,0);

  const payoffMonthsA = scheduleA.length;
  const payoffMonthsB = scheduleB.length;
  const monthsRemoved = payoffMonthsA - payoffMonthsB;

  const freedMonths = Math.max(0, H - payoffMonthsB);
  const freedFV = cas_freedPaymentsFV(payment, afterTax, freedMonths);

  const investFV = cas_investmentFV(prepayClamped, afterTax, H);
  const earningsForgone = investFV - prepayClamped;

  const interestAvoided = interestA_h - interestB_h;
  const netAdvantage = interestAvoided + freedFV - earningsForgone;

  return { payment, interestAvoided, earningsForgone, netAdvantage, monthsRemoved,
    payoffMonthsA, payoffMonthsB, freedFV, investFV, afterTax, H, prepayClamped };
}
function cas_breakEven(loanParams, prepay){
  const netAt = (gr)=>cas_analyze(loanParams, prepay, gr).netAdvantage;
  let lo=0, hi=30;
  if(prepay<=0) return null;
  const nlo=netAt(lo), nhi=netAt(hi);
  if(nlo<0) return 0;
  if(nhi>0) return null;
  for(let i=0;i<50;i++){
    const mid=(lo+hi)/2;
    if(netAt(mid)>0) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}
function cas_findOptimal(loanParams, grossReturn){
  const steps = 60;
  const maxP = loanParams.balance;
  let best = { p:0, net: cas_analyze(loanParams, 0, grossReturn).netAdvantage };
  for(let i=1;i<=steps;i++){
    const p = maxP*i/steps;
    const net = cas_analyze(loanParams, p, grossReturn).netAdvantage;
    if(net>best.net) best = { p, net };
  }
  return best;
}
function cas_curveSeries(loanParams){
  const steps = 24;
  const maxP = loanParams.balance;
  const pts = [];
  for(let i=0;i<=steps;i++){
    const p = maxP*i/steps;
    const r = cas_analyze(loanParams, p, state.cas.grossReturn);
    pts.push({ p, interestAvoided:r.interestAvoided, earningsForgone:r.earningsForgone, net:r.netAdvantage });
  }
  return pts;
}
function cas_svgCurve(series, selectedP, maxP, optimalP){
  const W=380, H=220, padL=44, padR=10, padT=10, padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const allY = series.flatMap(s=>[s.interestAvoided, s.earningsForgone, s.net]);
  let yMin=Math.min(0,...allY), yMax=Math.max(0,...allY);
  if(yMax-yMin<1) yMax=yMin+1;
  const pad=(yMax-yMin)*0.08; yMin-=pad; yMax+=pad;
  const x = (p)=> padL + (p/maxP)*plotW;
  const y = (v)=> padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;
  const line = (key)=> series.map((s,i)=>`${i===0?'M':'L'}${x(s.p).toFixed(1)},${y(s[key]).toFixed(1)}`).join(' ');
  const zeroY = y(0);
  const selX = x(Math.min(selectedP,maxP));
  const optX = x(Math.min(optimalP,maxP));
  const optY = y(series.reduce((best,s)=>Math.abs(s.p-optimalP)<Math.abs(best.p-optimalP)?s:best, series[0]).net);
  const ticksY = 4;
  let yTicks='';
  for(let i=0;i<=ticksY;i++){
    const v = yMin+(yMax-yMin)*i/ticksY;
    const yy = y(v);
    yTicks += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>`;
    yTicks += `<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--text-faint)" font-family="var(--font-mono)">${fmt$(v)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; overflow:visible;">
    ${yTicks}
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--text-faint)" stroke-width="1.2"/>
    <path d="${line('earningsForgone')}" fill="none" stroke="var(--forgone)" stroke-width="2"/>
    <path d="${line('interestAvoided')}" fill="none" stroke="var(--interest)" stroke-width="2"/>
    <path d="${line('net')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="${optX.toFixed(1)}" cy="${optY.toFixed(1)}" r="4.5" fill="var(--principal)" stroke="var(--surface)" stroke-width="1.5"/>
    <line x1="${selX.toFixed(1)}" y1="${padT}" x2="${selX.toFixed(1)}" y2="${H-padB}" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="${padL}" y="${H-6}" font-size="9" fill="var(--text-faint)" font-family="var(--font-mono)">$0</text>
    <text x="${W-padR}" y="${H-6}" text-anchor="end" font-size="9" fill="var(--text-faint)" font-family="var(--font-mono)">${fmt$(maxP)}</text>
  </svg>`;
}
function cas_loanParams(){
  const c = state.cas;
  if(c.selectedId==='custom') return { balance:c.customBalance, rate:c.customRate, termMonths:Math.round(c.customTermYears*12), name:'Custom hypothetical' };
  const loan = findLoan(c.selectedId);
  const row = currentRow(c.selectedId);
  const remMonths = Math.max(1, Math.round(yearsLeft(c.selectedId)*12));
  const entry = allocationLoans().find(e=>e.loan.id===c.selectedId);
  return { balance: row.balance, rate: loan.rate, termMonths: remMonths, name: entry ? entry.displayName : loan.label };
}
function cas_set(field, val){ state.cas[field] = numFrom(val); render(); }
function cas_selectLoan(id){ state.cas.selectedId = id; render(); }
function cas_setHorizon(key){ state.cas.horizonKey = key; render(); }
function cas_setSort(key){ state.cas.compareSort = key; render(); }
function cas_setOptimal(p){ RAW['in-cas-prepay']=String(Math.round(p)); state.cas.prepay = p; render(); }

function renderPrepayAnalysis(){
  const c = state.cas;
  const isCustom = c.selectedId==='custom';
  const loanParams = cas_loanParams();
  const r = cas_analyze(loanParams, c.prepay, c.grossReturn);
  const afterTaxYield = c.grossReturn*(1-c.taxRate/100);
  const breakEven = cas_breakEven(loanParams, c.prepay);
  const series = cas_curveSeries(loanParams);
  const optimal = cas_findOptimal(loanParams, c.grossReturn);
  const horizonLabel = c.horizonKey==='remaining' ? 'remaining term' : c.horizonKey==='custom' ? `${c.horizonYearsCustom}yr (custom)` : `${c.horizonKey}yr`;
  const netPositive = r.netAdvantage>=0;

  const decisionText = netPositive
    ? `At <b>${fmt$(c.prepay)}</b> toward ${loanParams.name}, prepaying now leaves you about <b>${fmt$(Math.abs(r.netAdvantage))} ahead</b> of keeping that money invested at a ${fmtPct(c.grossReturn)} gross return over ${horizonLabel}, assuming a ${fmtPct(c.taxRate)} tax rate on investment earnings.`
    : `At <b>${fmt$(c.prepay)}</b> toward ${loanParams.name}, keeping the money invested is modeled to leave you about <b>${fmt$(Math.abs(r.netAdvantage))} ahead</b> over ${horizonLabel} instead.`;

  const optimalIsMax = Math.abs(optimal.p - loanParams.balance) < loanParams.balance*0.01;
  const optimalIsZero = optimal.p < loanParams.balance*0.01;
  const dipsNegative = series.some(s=>s.net < -1);
  let optimalNote;
  if(optimalIsZero) optimalNote = `At these assumptions, investing beats prepaying at every amount tested &mdash; the optimal prepayment on ${loanParams.name} is $0.`;
  else if(optimalIsMax && !dipsNegative) optimalNote = `At these assumptions, more prepayment keeps helping all the way to payoff &mdash; the optimal amount is the full balance, ${fmt$(loanParams.balance)}.`;
  else if(optimalIsMax && dipsNegative) optimalNote = `Not a straight line: the modeled result dips <i>negative</i> for a stretch of partial prepayments before recovering &mdash; investing briefly wins in the middle of the range. Full payoff still comes out ahead overall.`;
  else optimalNote = `Net advantage peaks at ${fmt$(optimal.p)}, not at either extreme &mdash; worth checking the full curve below, not just this number.`;

  const allComparisons = allocationLoans().map(({loan, displayName, sub})=>{
    const row = currentRow(loan.id);
    const remMonths = Math.max(1, Math.round(yearsLeft(loan.id)*12));
    const ip = row.principal>0 ? row.interest/row.principal : 0;
    const lp = { balance: row.balance, rate: loan.rate, termMonths: remMonths, name: displayName };
    const applied = Math.min(c.prepay, row.balance);
    const res = cas_analyze(lp, applied, c.grossReturn);
    return { id: loan.id, name: displayName, sub, balance: row.balance, ip, termMonths: remMonths, applied, net: res.netAdvantage };
  });
  const sortFns = {
    net: (a,b)=>b.net-a.net,
    ip: (a,b)=>b.ip-a.ip,
    term: (a,b)=>a.termMonths-b.termMonths,
  };
  const considered = allComparisons.filter(x=>x.ip>=c.ipThreshold).sort(sortFns[c.compareSort]);
  const excluded = allComparisons.filter(x=>x.ip<c.ipThreshold).sort((a,b)=>b.ip-a.ip);

  return `
  <div class="header-sticky"><button class="back" onclick="goBack()">&lsaquo; ${backLabel()}</button></div>
  <div class="az-sticky">
    <div class="sheet-handle" style="display:none;"></div>
    <div style="font-size:17px; font-weight:700;">Pay Down Debt or Invest?</div>

/* ============ INCOME (real estate + investments, combined) ============ */
const INCOME_MONTHS_AHEAD = 600; // 50 years — long enough for full lifetime planning
function incomeSourceAge(src){
  if(src.kind==='property'){ return parseD(findProperty(src.id.slice(5)).loans[0].start).getTime(); }
  if(src.kind==='loan'){ const l=findStandaloneLoan(src.id.slice(5)); return l ? parseD(l.start).getTime() : Infinity; }
  const inv = findInvestment(src.id.slice(4));
  return inv && inv.balanceDate ? parseD(inv.balanceDate).getTime() : Infinity;
}
const INCOME_SORTS = {
  amount:{ label:'Amount', fn:src=>src.amount, defaultDir:-1 },
  profitable:{ label:'Profitable', fn:src=>src.amount, defaultDir:-1 },
  costly:{ label:'Costly', fn:src=>src.amount, defaultDir:1 },
  oldest:{ label:'Oldest', fn:src=>incomeSourceAge(src), defaultDir:1 }
};
function setIncomeSort(key){
  if(state.income.sortKey===key) state.income.sortDir *= -1;
  else { state.income.sortKey = key; state.income.sortDir = INCOME_SORTS[key].defaultDir; }
  render();
}
function toggleIncomeExpand(){ state.income.expanded = !state.income.expanded; render(); }
/* Precomputes every source's monthly value across the whole window in one pass each —
   calling invMonthlyReturnAtDate/propertyCashFlowAtDate per-cell would be far too slow at 600 rows. */
function computeIncomeSeries(months){
  const sources = incomeSources();
  const bySourceId = {};
  sources.forEach(src=>{
    if(src.kind==='investment'){
      bySourceId[src.id] = invMonthlyReturnSeries(findInvestment(src.id.slice(4)), months.length);
    } else {
      const prop = findProperty(src.id.slice(5));
      bySourceId[src.id] = months.map(d=>propertyCashFlowAtDate(prop, d));
    }
  });
  const totals = months.map((d,i)=> sources.reduce((s,src)=>s+bySourceId[src.id][i], 0));
  return { bySourceId, totals };
}

function incomeSourceCard(src){
  const color = src.amount>=0 ? 'var(--principal)' : 'var(--interest)';
  const onclick = src.kind==='property' ? `push({type:'loan', id:'${src.id.slice(5)}'})` : `push({type:'investment', id:'${src.id.slice(4)}'})`;
  return `<div class="prop-card" onclick="${onclick}">
    <div class="prop-top">
      <div><div class="prop-name" style="font-size:15px;">${src.name}</div><div class="prop-sub">${src.sub}</div></div>
      <div style="text-align:right;"><div class="prop-balance" style="font-size:16px; color:${color};">${fmtSigned$(src.amount)}/mo</div></div>
    </div>
  </div>`;
}

function renderIncomeTimeline(cols, months, series){
  return `
  <div class="amort-window scrollx" style="max-height:420px;">
  <table class="amort">
    <thead><tr>
      <th>Date</th>
      <th>Total</th>
      ${cols.map(c=>{
        const label = (c.kind==='investment'?'~ ':'')+(c.name.length>13?c.name.slice(0,12)+'&hellip;':c.name);
        return c.kind==='investment' ? `<th style="cursor:pointer; text-decoration:underline; text-decoration-style:dotted;" onclick="push({type:'investment', id:'${c.id.slice(4)}'})">${label}</th>` : `<th>${label}</th>`;
      }).join('')}
    </tr></thead>
    <tbody>
    ${months.map((date,i)=>{
      const rowTotal = series.totals[i];
      const dateKey = mkey(date)+'-01';
      return `<tr class="${mkey(date)===mkey(TODAY)?'state-current':''}">
        <td>${fmtMonth(date)}</td>
        <td style="font-weight:700; color:${rowTotal>=0?'var(--principal)':'var(--interest)'};">${fmtSigned$(rowTotal)}</td>
        ${cols.map(c=>{
          const v = series.bySourceId[c.id][i];
          if(c.kind!=='investment'){
            return `<td style="color:${v>=0?'var(--principal)':'var(--interest)'};">${fmtSigned$(v)}</td>`;
          }
          const inv = findInvestment(c.id.slice(4));
          const cellEvents = invCellEvents(inv, dateKey);
          const dot = cellEvents.length ? `<span class="dot" style="background:var(${cellEvents.some(e=>e.status==='planned')?'--planned':'--confirmed'}); margin-left:4px;"></span>` : '';
          return `<td style="color:${v>=0?'var(--principal)':'var(--interest)'}; cursor:pointer;" onclick="inv_openCellAction('${inv.id}','${dateKey}')">${fmtSigned$(v)}${dot}</td>`;
        }).join('')}
      </tr>`;
    }).join('')}
    </tbody>
  </table>
  </div>
  `;
}

/* The 600-row timeline is expensive (~140ms) to compute + render. Most renders happen for reasons
   unrelated to it (typing in a sheet, switching tabs elsewhere) — so cache its HTML and only rebuild
   when something that actually feeds it (sort/expand toggle, or the underlying property/investment
   data itself) has changed, using a cheap JSON signature as the cache key. */
let _incomeTimelineCache = { key:null, html:null };
function renderIncomeTimelineCached(allSources){
  const timelineCols = state.income.expanded ? allSources : allSources.slice(0,5);
  const cacheKey = state.income.sortDir+'|'+(state.income.sortKey||'amount')+'|'+state.income.expanded+'|'+
    JSON.stringify(investments)+'|'+
    JSON.stringify(standaloneLoans)+'|'+
    JSON.stringify(properties.map(p=>({id:p.id, taxesAnnual:p.taxesAnnual, insuranceAnnual:p.insuranceAnnual, pmPct:p.pmPct, maintenancePct:p.maintenancePct, customCosts:p.customCosts, units:p.units, loans:p.loans, otherLoans:p.otherLoans, nnn:p.nnn})));
  if(_incomeTimelineCache.key === cacheKey) return _incomeTimelineCache.html;
  const months = []; for(let i=0;i<INCOME_MONTHS_AHEAD;i++) months.push(addM(TODAY,i));
  const series = computeIncomeSeries(months);
  const html = renderIncomeTimeline(timelineCols, months, series);
  _incomeTimelineCache = { key:cacheKey, html };
  return html;
}
function renderIncome(){
  const sortKey = state.income.sortKey||'amount';
  const sortDir = state.income.sortDir;
  const sortFn = INCOME_SORTS[sortKey].fn;
  const allSources = incomeSources().sort((a,b)=>(sortFn(a)-sortFn(b))*sortDir);
  const total = allSources.reduce((s,x)=>s+x.amount,0);
  return `
  <div class="header"><h1>Income</h1><div style="display:flex; gap:8px;"><div class="iconbtn" onclick="inv_openAdd()">+</div><div class="iconbtn" onclick="push({type:'settings'})">${tabIcon('gear')}</div></div></div>
  <div class="card">
    <div class="dim" style="font-size:12.5px;">Total monthly receivables &mdash; ${fmtMonth(TODAY)}</div>
    <div class="big-number" style="margin-top:4px; color:${total>=0?'var(--text)':'var(--interest)'};">${fmt$(total)}</div>
    <div class="dim" style="font-size:11.5px; margin-top:8px;">${properties.length} propert${properties.length===1?'y':'ies'} &middot; ${investments.filter(i=>i.committed!==false).length} investment${investments.filter(i=>i.committed!==false).length===1?'':'s'}</div>
  </div>

  <div class="sort-row">
    ${Object.entries(INCOME_SORTS).map(([k,v])=>`<div class="chip ${sortKey===k?'active':''}" onclick="setIncomeSort('${k}')">${v.label}${sortKey===k?(sortDir===1?' &uarr;':' &darr;'):''}</div>`).join('')}
  </div>

  ${allSources.length===0 ? `<div class="dim" style="font-size:13px; margin-top:10px;">No receivables yet.</div>` : allSources.map(src=>incomeSourceCard(src)).join('')}

  <div class="section-label" style="margin-top:22px;">Monthly Timeline</div>
  ${renderIncomeTimelineCached(allSources)}
  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-top:8px;">
    <details class="footnote" style="margin:0;"><summary class="info-btn">&#9432;</summary><div class="footnote-body">Real estate columns come from each loan's real schedule &mdash; rent and costs assumed to hold steady until you update them. Columns marked ~ are investments, projected at the current rate &mdash; not guaranteed, since markets move. Row for ${fmtMonth(TODAY)} is highlighted as the current month. Showing ${INCOME_MONTHS_AHEAD/12} years out.</div></details>
    ${allSources.length>5 ? `<span class="link" style="font-size:13px; white-space:nowrap;" onclick="toggleIncomeExpand()">${state.income.expanded?'Show top 5 only':'Expand to show all '+allSources.length+' sources'} &rsaquo;</span>` : ''}
  </div>
  `;
}

/* ---- Investment CRUD ---- */
function inv_openAdd(){
  const id = newInvId();
  investments.push({ id, name:'', balance:0, rate:0, rateDate:null, balanceDate:null, events:[], committed:false, isSample:false });
  push({type:'investment', id});
}
function inv_delete(id){
  const idx = investments.findIndex(i=>i.id===id);
  if(idx>=0) investments.splice(idx,1);
  goBack();
}
function inv_closeUncommitted(id){
  const inv = findInvestment(id);
  if(inv && inv.committed===false){
    const idx = investments.findIndex(i=>i.id===id);
    if(idx>=0) investments.splice(idx,1);
  }
  goBack();
}
function inv_commit(id){
  const inv = findInvestment(id);
  if(!inv || !inv.name.trim() || inv.balance<=0) return;
  inv.committed = true;
  render();
}
function inv_set(id, field, val){
  const inv = findInvestment(id);
  inv[field] = Math.max(0, numFrom(val));
  if(field==='rate') inv.rateDate = mkey(TODAY)+'-01';
  if(field==='balance') inv.balanceDate = mkey(TODAY)+'-01';
  render();
}
function inv_setName(id, val){ const inv=findInvestment(id); if(inv) inv.name=val; render(); }
function inv_toggleEdit(){ state.income.invEdit = !state.income.invEdit; render(); }
function inv_setRecurring(id, val){
  const inv = findInvestment(id);
  const amt = Math.max(0, numFrom(val));
  if(amt<=0){ inv.recurring = null; render(); return; }
  if(!inv.recurring) inv.recurring = { amount:amt, direction:'credit', note:'', startDate: mkey(addM(TODAY,1))+'-01' };
  else inv.recurring.amount = amt;
  render();
}
function inv_setRecurringDirection(id, dir){ const inv=findInvestment(id); if(inv.recurring) inv.recurring.direction=dir; render(); }
function inv_setRecurringNote(id, val){ const inv=findInvestment(id); if(inv.recurring) inv.recurring.note=val; render(); }
function inv_clearRecurring(id){ const inv=findInvestment(id); inv.recurring=null; render(); }

/* ---- Withdraw / Transfer ---- */
function inv_openWithdraw(id){
  state.invActionDraft = { amount:0, date:mkey(addM(TODAY,1))+'-01', toId:null };
  openSheet({type:'invAction', mode:'withdraw', id});
}
function inv_openTransfer(id){
  const other = investments.find(i=>i.id!==id && i.committed!==false);
  state.invActionDraft = { amount:0, date:mkey(addM(TODAY,1))+'-01', toId: other?other.id:null };
  openSheet({type:'invAction', mode:'transfer', id});
}
function invAction_setAmount(v){ state.invActionDraft.amount = Math.max(0, numFrom(v)); render(); }
function invAction_setDate(v){ if(v) state.invActionDraft.date = v+'-01'; render(); }
function invAction_setTo(id){ state.invActionDraft.toId = id; render(); }
function invAction_submit(){
  const { mode, id } = state.sheet;
  const draft = state.invActionDraft;
  const inv = findInvestment(id);
  if(!inv || draft.amount<=0) return;
  const amt = Math.min(draft.amount, inv.balance);
  inv.balance -= amt;
  inv.balanceDate = mkey(TODAY)+'-01';
  inv.events = inv.events||[];
  inv.events.push({ id:newInvEventId(), type: mode==='withdraw'?'withdrawal':'transfer_out', date:draft.date, amount:amt, linkedName: mode==='transfer' ? (findInvestment(draft.toId)||{}).name : null });
  if(mode==='transfer' && draft.toId){
    const dest = findInvestment(draft.toId);
    if(dest){
      dest.balance += amt;
      dest.balanceDate = mkey(TODAY)+'-01';
      dest.events = dest.events||[];
      dest.events.push({ id:newInvEventId(), type:'transfer_in', date:draft.date, amount:amt, linkedName: inv.name });
    }
  }
  closeSheet();
}
function renderInvActionSheet(){
  const { mode, id } = state.sheet;
  const inv = findInvestment(id);
  const draft = state.invActionDraft;
  const otherInvs = investments.filter(i=>i.id!==id && i.committed!==false);
  const title = mode==='withdraw' ? 'Withdraw' : 'Transfer';
  const canSubmit = draft.amount>0 && (mode==='withdraw' || draft.toId);
  return `<div class="overlay" onclick="if(event.target===this) closeSheet()"><div class="sheet">
    <div class="sheet-handle"></div>
    ${sheetHead(title, inv.name, false)}
    <div class="dim" style="font-size:12px; margin-bottom:2px;">Amount</div>
    <div class="input-row"><span class="suffix">$</span><input id="in-invaction-amt" type="text" inputmode="decimal" value="${rv('in-invaction-amt',draft.amount)}" oninput="RAW['in-invaction-amt']=this.value; invAction_setAmount(this.value)"/></div>
    <div class="dim" style="font-size:12px; margin:12px 0 2px;">Date</div>
    <div class="input-row"><input type="month" value="${mkey(parseD(draft.date))}" oninput="invAction_setDate(this.value)" style="background:none;border:none;color:var(--text);font-family:var(--font-mono);font-size:16px;font-weight:700;outline:none;width:100%;"/></div>
    ${mode==='transfer' ? `
    <div class="dim" style="font-size:12px; margin:12px 0 2px;">To</div>
    <div class="sort-row" style="margin:2px 0 0;">
