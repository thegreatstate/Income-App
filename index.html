function renderPrepayAnalysis(){
  const c = state.cas;
  const isCustom = c.selectedId==='custom';
  const loanParams = cas_loanParams();
  const r = cas_analyze(loanParams, c.prepay, c.grossReturn);
  const afterTaxYield = c.grossReturn*(1-c.taxRate/100);
  const breakEven = cas_breakEven(loanParams, c.prepay);
  const series = cas_curveSeries(loanParams);
  const optimal = cas_findOptimal(loanParams, c.grossReturn);
  const horizonLabel = c.horizonKey==='remaining' ? 'remaining term' : c.horizonKey==='custom' ? `${c.horizonYearsCustom}yr (custom)` : `${c.horizonKey}yr`;
  const netPositive = r.netAdvantage>=0;

  const decisionText = netPositive
    ? `At <b>${fmt$(c.prepay)}</b> toward ${loanParams.name}, prepaying now leaves you about <b>${fmt$(Math.abs(r.netAdvantage))} ahead</b> of keeping that money invested at a ${fmtPct(c.grossReturn)} gross return over ${horizonLabel}, assuming a ${fmtPct(c.taxRate)} tax rate on investment earnings.`
    : `At <b>${fmt$(c.prepay)}</b> toward ${loanParams.name}, keeping the money invested is modeled to leave you about <b>${fmt$(Math.abs(r.netAdvantage))} ahead</b> over ${horizonLabel} instead.`;

  const optimalIsMax = Math.abs(optimal.p - loanParams.balance) < loanParams.balance*0.01;
  const optimalIsZero = optimal.p < loanParams.balance*0.01;
  const dipsNegative = series.some(s=>s.net < -1);
  let optimalNote;
  if(optimalIsZero) optimalNote = `At these assumptions, investing beats prepaying at every amount tested &mdash; the optimal prepayment on ${loanParams.name} is $0.`;
  else if(optimalIsMax && !dipsNegative) optimalNote = `At these assumptions, more prepayment keeps helping all the way to payoff &mdash; the optimal amount is the full balance, ${fmt$(loanParams.balance)}.`;
  else if(optimalIsMax && dipsNegative) optimalNote = `Not a straight line: the modeled result dips <i>negative</i> for a stretch of partial prepayments before recovering &mdash; investing briefly wins in the middle of the range. Full payoff still comes out ahead overall.`;
  else optimalNote = `Net advantage peaks at ${fmt$(optimal.p)}, not at either extreme &mdash; worth checking the full curve below, not just this number.`;

  const allComparisons = allocationLoans().map(({loan, displayName, sub})=>{
    const row = currentRow(loan.id);
    const remMonths = Math.max(1, Math.round(yearsLeft(loan.id)*12));
    const ip = row.principal>0 ? row.interest/row.principal : 0;
    const lp = { balance: row.balance, rate: loan.rate, termMonths: remMonths, name: displayName };
    const applied = Math.min(c.prepay, row.balance);
    const res = cas_analyze(lp, applied, c.grossReturn);
    return { id: loan.id, name: displayName, sub, balance: row.balance, ip, termMonths: remMonths, applied, net: res.netAdvantage };
  });
  const sortFns = {
    net: (a,b)=>b.net-a.net,
    ip: (a,b)=>b.ip-a.ip,
    term: (a,b)=>a.termMonths-b.termMonths,
  };
  const considered = allComparisons.filter(x=>x.ip>=c.ipThreshold).sort(sortFns[c.compareSort]);

/* ============ INCOME (real estate + investments, combined) ============ */
const INCOME_MONTHS_AHEAD = 600; // 50 years — long enough for full lifetime planning
function incomeSourceAge(src){
  if(src.kind==='property'){ return parseD(findProperty(src.id.slice(5)).loans[0].start).getTime(); }
  if(src.kind==='loan'){ const l=findStandaloneLoan(src.id.slice(5)); return l ? parseD(l.start).getTime() : Infinity; }
  const inv = findInvestment(src.id.slice(4));
  return inv && inv.balanceDate ? parseD(inv.balanceDate).getTime() : Infinity;
}
const INCOME_SORTS = {
  amount:{ label:'Amount', fn:src=>src.amount, defaultDir:-1 },
  profitable:{ label:'Profitable', fn:src=>src.amount, defaultDir:-1 },
  costly:{ label:'Costly', fn:src=>src.amount, defaultDir:1 },
  oldest:{ label:'Oldest', fn:src=>incomeSourceAge(src), defaultDir:1 }
};
function setIncomeSort(key){
  if(state.income.sortKey===key) state.income.sortDir *= -1;
  else { state.income.sortKey = key; state.income.sortDir = INCOME_SORTS[key].defaultDir; }
  render();
}
function toggleIncomeExpand(){ state.income.expanded = !state.income.expanded; render(); }
/* Precomputes every source's monthly value across the whole window in one pass each —
   calling invMonthlyReturnAtDate/propertyCashFlowAtDate per-cell would be far too slow at 600 rows. */
function computeIncomeSeries(months){
  const sources = incomeSources();
  const bySourceId = {};
  const growthSourceIds = new Set(growthShareTargets().map(t=>'inv:'+t.id));
  sources.forEach(src=>{
    if(src.kind==='investment'){
      if(growthSourceIds.has(src.id)) return; // filled in below, walked jointly
      bySourceId[src.id] = invMonthlyReturnSeries(findInvestment(src.id.slice(4)), months.length);
    } else if(src.kind==='loan'){
      bySourceId[src.id] = months.map(d=>-standaloneLoanPaymentAtDate(src.id.slice(5), d));
    } else {
      const prop = findProperty(src.id.slice(5));
      bySourceId[src.id] = months.map(d=>propertyCashFlowAtDate(prop, d));
    }
  });
  if(growthSourceIds.size){
    const propLoanSeries = months.map((d,i)=> sources.filter(s=>s.kind!=='investment').reduce((s,src)=>s+bySourceId[src.id][i],0));
    const nonGrowthInvInterestSeries = months.map((d,i)=> sources.filter(s=>s.kind==='investment' && !growthSourceIds.has(s.id)).reduce((s,src)=>s+bySourceId[src.id][i],0));
    const growthResult = computeGrowthShareSeries(months.length, propLoanSeries, nonGrowthInvInterestSeries);
    growthSourceIds.forEach(sid=>{
      bySourceId[sid] = growthResult.interest[sid.slice(4)];
    });
  }
  const totals = months.map((d,i)=> sources.reduce((s,src)=>s+bySourceId[src.id][i], 0));
  return { bySourceId, totals };
}

function incomeSourceCard(src){
  const color = src.amount>=0 ? 'var(--principal)' : 'var(--interest)';
  const returnKind = src.kind==='property' ? 'properties' : 'investments';
  const onclick = src.kind==='property'
    ? `state.returnToSheet={type:'incomeList', kind:'${returnKind}'}; closeSheet(); push({type:'loan', id:'${src.id.slice(5)}'})`
    : `state.returnToSheet={type:'incomeList', kind:'${returnKind}'}; closeSheet(); push({type:'investment', id:'${src.id.slice(4)}'})`;
  const inv = src.kind==='investment' ? findInvestment(src.id.slice(4)) : null;
  return `<div class="prop-card" onclick="${onclick}">
    <div class="prop-top">
      <div><div class="prop-name" style="font-size:15px;">${src.name}</div><div class="prop-sub">${src.sub}</div></div>

function renderIncomeTimeline(cols, months, series){
  return `

    <thead><tr>
      <th>Date</th>
      <th>Total</th>
      ${cols.map(c=>{
        const label = (c.kind==='investment'?'~ ':'')+(c.name.length>13?c.name.slice(0,12)+'&hellip;':c.name);
        if(c.kind==='investment') return `<th style="cursor:pointer; text-decoration:underline; text-decoration-style:dotted;" onclick="push({type:'investment', id:'${c.id.slice(4)}'})">${label}</th>`;
        if(c.kind==='property') return `<th style="cursor:pointer; text-decoration:underline; text-decoration-style:dotted;" onclick="push({type:'loan', id:'${c.id.slice(5)}'})">${label}</th>`;
        if(c.kind==='loan') return `<th style="cursor:pointer; text-decoration:underline; text-decoration-style:dotted;" onclick="push({type:'loan', id:'${c.id.slice(5)}'})">${label}</th>`;

    <tbody>
    ${months.map((date,i)=>{
      const rowTotal = series.totals[i];
      const dateKey = mkey(date)+'-01';
      return `<tr id="incomerow-${i}" class="${timelineRowClass(i, months.length)}">
        <td>${fmtMonth(date)}</td>
        <td style="font-weight:700; color:${rowTotal>=0?'var(--principal)':'var(--interest)'};">${fmtSigned$(rowTotal)}</td>

          const v = series.bySourceId[c.id][i];
          if(c.kind==='property'){
            return `<td style="color:${v>=0?'var(--principal)':'var(--interest)'}; cursor:pointer;" onclick="prop_openCellAction('${c.id.slice(5)}','${dateKey}')">${fmtSigned$(v)}</td>`;
          }
          if(c.kind==='loan'){
            return `<td style="color:${v>=0?'var(--principal)':'var(--interest)'}; cursor:pointer;" onclick="loan_openCellAction('${c.id.slice(5)}','${dateKey}')">${fmtSigned$(v)}</td>`;
          }

        }).join('')}

/* The 600-row timeline is expensive (~140ms) to compute + render. Most renders happen for reasons
   unrelated to it (typing in a sheet, switching tabs elsewhere) — so cache its HTML and only rebuild
   when something that actually feeds it (sort/expand toggle, or the underlying property/investment
   data itself) has changed, using a cheap JSON signature as the cache key. */
let _incomeTimelineCache = { key:null, html:null };
function renderIncomeTimelineCached(allSources){
  const timelineCols = state.income.expanded ? allSources : allSources.slice(0,5);
  const cacheKey = state.income.sortDir+'|'+(state.income.sortKey||'amount')+'|'+state.income.expanded+'|'+state.settings.privacyMode+'|'+
    JSON.stringify(investments)+'|'+
    JSON.stringify(standaloneLoans)+'|'+
    JSON.stringify(properties.map(p=>({id:p.id, taxesAnnual:p.taxesAnnual, insuranceAnnual:p.insuranceAnnual, pmPct:p.pmPct, maintenancePct:p.maintenancePct, customCosts:p.customCosts, units:p.units, loans:p.loans, otherLoans:p.otherLoans, nnn:p.nnn})));
  if(_incomeTimelineCache.key === cacheKey) return _incomeTimelineCache.html;
  const months = []; for(let i=0;i<INCOME_MONTHS_AHEAD;i++) months.push(addM(TODAY,i));
  const series = computeIncomeSeries(months);
  const html = renderIncomeTimeline(timelineCols, months, series);
  _incomeTimelineCache = { key:cacheKey, html };
  return html;
}
function renderIncome(){
  const sortKey = state.income.sortKey||'amount';
  const sortDir = state.income.sortDir;
  const sortFn = INCOME_SORTS[sortKey].fn;
  const allSources = incomeSources().sort((a,b)=>(sortFn(a)-sortFn(b))*sortDir);
  const total = allSources.reduce((s,x)=>s+x.amount,0);
  const spending = effectiveSpendingAtDate(TODAY);
  const growth = total - spending;
  const propertySources = allSources.filter(s=>s.kind!=='investment');
  const investmentSources = allSources.filter(s=>s.kind==='investment');
  const committedInvestmentsCount = investments.filter(i=>i.committed!==false).length;
  return `
  <div class="tab-header-sticky">
    <div class="header" style="margin-bottom:14px;">
      <h1>Income</h1>
      <div style="display:flex; gap:8px; align-items:center;">

    </div>
    <div class="stat-row">
      <div class="stat-pill" style="cursor:pointer;" onclick="fvm_showBreakdown('receivables','${mkey(TODAY)}-01')"><div class="v" style="color:${total>=0?'var(--text)':'var(--interest)'};">${fmt$(total)}</div><div class="l">${fmtMonth(TODAY)}</div></div>
      <div class="stat-pill" style="cursor:pointer;" onclick="openSheet({type:'incomeAdjust'})"><div class="v">${fmt$(spending)}</div><div class="l">Income &rsaquo;</div></div>
      <div class="stat-pill" style="cursor:pointer;" onclick="openSheet({type:'growthTarget'})"><div class="v" style="color:${growth>=0?'var(--principal)':'var(--interest)'}">${fmtSigned$(growth)}</div><div class="l">Growth &rsaquo;</div></div>
    </div>
    <div class="dim" style="font-size:11.5px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <span class="link" onclick="openSheet({type:'incomeList', kind:'properties'})">${properties.length} propert${properties.length===1?'y':'ies'}</span>
        &middot;
        <span class="link" onclick="openSheet({type:'incomeList', kind:'investments'})">${committedInvestmentsCount} investment${committedInvestmentsCount===1?'':'s'}</span>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <details class="footnote" style="margin:0; position:relative;"><summary class="info-btn" style="width:26px; height:26px;">&#9432;</summary><div class="footnote-body" style="position:absolute; right:0; top:32px; width:260px; background:var(--surface-3); border:1px solid var(--border); border-radius:12px; padding:12px 14px; z-index:20; font-size:12px; line-height:1.5;">Real estate columns come from each loan's real schedule &mdash; rent and costs assumed to hold steady until you update them. Columns marked ~ are investments, projected at the current rate &mdash; not guaranteed, since markets move. Row for ${fmtMonth(TODAY)} is highlighted as the current month. Showing ${INCOME_MONTHS_AHEAD/12} years out.</div></details>

/* ---- Investment CRUD ---- */
function inv_openAdd(){
  const id = newInvId();
  investments.push({ id, name:'', balance:0, rate:0, rateDate:null, balanceDate:null, events:[], committed:false, isSample:false });
  push({type:'investment', id});
}
function inv_delete(id){
  const idx = investments.findIndex(i=>i.id===id);
  if(idx>=0) investments.splice(idx,1);
  goBack();
}
function inv_closeUncommitted(id){
  const inv = findInvestment(id);
  if(inv && inv.committed===false){
    const idx = investments.findIndex(i=>i.id===id);
    if(idx>=0) investments.splice(idx,1);
  }
  goBack();
}
function inv_commit(id){
  const inv = findInvestment(id);
  if(!inv || !inv.name.trim() || inv.balance<=0) return;
  inv.committed = true;
  render();
}
function inv_set(id, field, val){
  const inv = findInvestment(id);
  inv[field] = Math.max(0, numFrom(val));
  if(field==='rate') inv.rateDate = mkey(TODAY)+'-01';
  if(field==='balance') inv.balanceDate = mkey(TODAY)+'-01';
  render();
}
function inv_setName(id, val){ const inv=findInvestment(id); if(inv) inv.name=val; render(); }
function inv_toggleEdit(){ state.income.invEdit = !state.income.invEdit; render(); }
function inv_setRecurring(id, val){
  const inv = findInvestment(id);
  const amt = Math.max(0, numFrom(val));
  if(amt<=0){ inv.recurring = null; render(); return; }
  if(!inv.recurring) inv.recurring = { amount:amt, direction:'credit', note:'', startDate: mkey(addM(TODAY,1))+'-01' };
  else inv.recurring.amount = amt;
  render();
}
function inv_setRecurringDirection(id, dir){ const inv=findInvestment(id); if(inv.recurring) inv.recurring.direction=dir; render(); }
function inv_setRecurringNote(id, val){ const inv=findInvestment(id); if(inv.recurring) inv.recurring.note=val; render(); }
function inv_clearRecurring(id){ const inv=findInvestment(id); inv.recurring=null; render(); }
function inv_setRecurringMode(id, mode){
  const inv = findInvestment(id);
  if(mode==='growth'){
    if(!inv.recurring) inv.recurring = { amount:0, direction:'credit', note:'', startDate: mkey(addM(TODAY,1))+'-01', growthShare:{mode:'pct', value:100} };
    else if(!inv.recurring.growthShare) inv.recurring.growthShare = {mode:'pct', value:100};
  } else if(inv.recurring){
    inv.recurring.growthShare = null;
  }
  render();
}
function inv_setGrowthShareMode(id, mode){
  const inv = findInvestment(id);
  if(inv.recurring && inv.recurring.growthShare) inv.recurring.growthShare.mode = mode;
  render();
}
function inv_setGrowthShareValue(id, val){
  const inv = findInvestment(id);
  if(inv.recurring && inv.recurring.growthShare) inv.recurring.growthShare.value = Math.max(0, numFrom(val));
  render();
}
function set_monthlySpending(val){ state.settings.monthlySpending = Math.max(0, numFrom(val)); render(); }
function set_spendingPctOfInterest(val){ state.settings.spendingPctOfInterest = Math.max(0, Math.min(100, numFrom(val))); render(); }
function spendingOverride_add(){
  householdSpendingOverrides.push({ id:newSpendingOverrideId(), start: mkey(addM(TODAY,1))+'-01', end: mkey(addM(TODAY,3))+'-01', amount: state.settings.monthlySpending||0, note:'' });
  render();
}
function spendingOverride_setStart(id, val){ const o=householdSpendingOverrides.find(x=>x.id===id); if(o&&val) o.start=val+'-01'; render(); }
function spendingOverride_setEnd(id, val){ const o=householdSpendingOverrides.find(x=>x.id===id); if(o&&val) o.end=val+'-01'; render(); }
function spendingOverride_setAmount(id, val){ const o=householdSpendingOverrides.find(x=>x.id===id); if(o) o.amount=Math.max(0, numFrom(val)); render(); }
function spendingOverride_setNote(id, val){ const o=householdSpendingOverrides.find(x=>x.id===id); if(o) o.note=val; render(); }
function spendingOverride_delete(id){ const idx=householdSpendingOverrides.findIndex(x=>x.id===id); if(idx>=0) householdSpendingOverrides.splice(idx,1); render(); }
function toggleGrowthTarget(investmentId){
  const inv = findInvestment(investmentId);
  if(inv.recurring && inv.recurring.growthShare){
    inv.recurring.growthShare = null;
  } else {
    if(!inv.recurring) inv.recurring = { amount:0, direction:'credit', note:'Growth split', startDate: mkey(addM(TODAY,1))+'-01', growthShare:{mode:'pct', value:100} };
    else inv.recurring.growthShare = {mode:'pct', value:100};
  }
  render();
}
/* ---- Withdraw / Transfer ---- */
function inv_openWithdraw(id){
  state.invActionDraft = { amount:0, date:mkey(addM(TODAY,1))+'-01', toId:null };
  openSheet({type:'invAction', mode:'withdraw', id});
}
function inv_openTransfer(id){
  const other = investments.find(i=>i.id!==id && i.committed!==false);
  state.invActionDraft = { amount:0, date:mkey(addM(TODAY,1))+'-01', toId: other?other.id:null };
  openSheet({type:'invAction', mode:'transfer', id});
}
function invAction_setAmount(v){ state.invActionDraft.amount = Math.max(0, numFrom(v)); render(); }
function invAction_setDate(v){ if(v) state.invActionDraft.date = v+'-01'; render(); }
function invAction_setTo(id){ state.invActionDraft.toId = id; render(); }
function invAction_submit(){
  const { mode, id } = state.sheet;
  const draft = state.invActionDraft;
  const inv = findInvestment(id);
  if(!inv || draft.amount<=0) return;
  const amt = Math.min(draft.amount, inv.balance);
  inv.balance -= amt;
  inv.balanceDate = mkey(TODAY)+'-01';
  inv.events = inv.events||[];
  inv.events.push({ id:newInvEventId(), type: mode==='withdraw'?'withdrawal':'transfer_out', date:draft.date, amount:amt, linkedName: mode==='transfer' ? (findInvestment(draft.toId)||{}).name : null });
  if(mode==='transfer' && draft.toId){
    const dest = findInvestment(draft.toId);
    if(dest){
      dest.balance += amt;
      dest.balanceDate = mkey(TODAY)+'-01';
      dest.events = dest.events||[];
      dest.events.push({ id:newInvEventId(), type:'transfer_in', date:draft.date, amount:amt, linkedName: inv.name });
    }
  }
  closeSheet();
}
function renderInvActionSheet(){
  const { mode, id } = state.sheet;
  const inv = findInvestment(id);
  const draft = state.invActionDraft;
  const otherInvs = investments.filter(i=>i.id!==id && i.committed!==false);
  const title = mode==='withdraw' ? 'Withdraw' : 'Transfer';
  const canSubmit = draft.amount>0 && (mode==='withdraw' || draft.toId);
  return `<div class="overlay" onclick="if(event.target===this) closeSheet()"><div class="sheet">
    <div class="sheet-handle"></div>
    ${sheetHead(title, displayName(inv), false)}
    <div class="dim" style="font-size:12px; margin-bottom:2px;">Amount</div>
    <div class="input-row"><span class="suffix">$</span><input id="in-invaction-amt" type="text" inputmode="decimal" value="${rv('in-invaction-amt',draft.amount)}" oninput="RAW['in-invaction-amt']=this.value; invAction_setAmount(this.value)"/></div>
    <div class="dim" style="font-size:12px; margin:12px 0 2px;">Date</div>
    <div class="input-row"><input type="month" value="${mkey(parseD(draft.date))}" oninput="invAction_setDate(this.value)" style="background:none;border:none;color:var(--text);font-family:var(--font-mono);font-size:16px;font-weight:700;outline:none;width:100%;"/></div>
    ${mode==='transfer' ? `
    <div class="dim" style="font-size:12px; margin:12px 0 2px;">To</div>
    <div class="sort-row" style="margin:2px 0 0;">
      ${otherInvs.length===0 ? `<div class="dim" style="font-size:12.5px;">No other investments to transfer to &mdash; add one first.</div>` : otherInvs.map(o=>`<div class="chip ${draft.toId===o.id?'active':''}" onclick="invAction_setTo('${o.id}')">${displayName(o)}</div>`).join('')}
    </div>
    ` : ''}
    <div class="dim" style="font-size:11.5px; margin-top:10px;">Available: ${fmt$(inv.balance)}</div>
    <div class="btn-row" style="margin-top:14px;">
      <div class="btn btn-primary" style="${canSubmit?'':'opacity:.5; pointer-events:none;'}" onclick="invAction_submit()">${title}${draft.amount>0?' '+fmt$(Math.min(draft.amount,inv.balance)):''}</div>
    </div>
    <details class="footnote"><summary class="info-btn">&#9432;</summary><div class="footnote-body">${mode==='withdraw' ? 'Money leaves the tracked pool entirely &mdash; balance drops, no destination recorded.' : 'Recorded as a linked debit/credit pair &mdash; the destination\'s balance goes up by the same amount that comes off this one.'}</div></details>
  </div></div>`;
}

/* ---- Cell-level debit/credit (from Income timeline) ---- */
function inv_openCellAction(invId, dateStr){
  state.invActionDraft = { amount:0, date:dateStr, direction:'debit', note:'', editingEventId:null };
  openSheet({type:'invCellAction', id:invId});
}
/* Same sheet as a cell tap, just entered from the header's +/− buttons instead — no
   account or month picked yet, so the sheet grows an account picker and the date
   becomes editable up front rather than being implied by whichever cell you tapped. */
function inv_openQuickAction(direction){
  state.invActionDraft = { amount:0, date:mkey(TODAY)+'-01', direction: direction==='spend'?'debit':'credit', note:'', editingEventId:null };
  openSheet({type:'invCellAction', id:null});
}
function invAction_pickInv(id){ state.sheet.id = id; render(); }
function invAction_setDirection(dir){ state.invActionDraft.direction = dir; render(); }
function invAction_setNote(v){ state.invActionDraft.note = v; render(); }
function inv_editCellEvent(invId, eventId){
  const inv = findInvestment(invId);
  const e = (inv.events||[]).find(x=>x.id===eventId);
  if(!e) return;
  state.invActionDraft = { amount:e.amount, date:e.date, direction: e.type==='deposit'?'credit':'debit', note:e.note||'', editingEventId:e.id };
  render();
}
function inv_cancelCellEdit(){
  const d = state.invActionDraft;
  d.amount=0; d.note=''; d.editingEventId=null;
  render();
}
function inv_deleteCellEvent(invId, eventId){
  const inv = findInvestment(invId);
  const idx = (inv.events||[]).findIndex(e=>e.id===eventId);
  if(idx<0) return;
  const e = inv.events[idx];
  if(parseD(e.date)<=TODAY){ inv.balance -= invEventSign(e.type)*e.amount; }
  inv.events.splice(idx,1);
  const draft = state.invActionDraft;
  if(draft && draft.editingEventId===eventId){ draft.amount=0; draft.note=''; draft.editingEventId=null; }
  render();
}
function invAction_submitCell(status){
  const { id } = state.sheet;
  const draft = state.invActionDraft;
  const inv = findInvestment(id);
  if(!inv || draft.amount<=0) return;
  const amt0 = draft.amount, note0 = draft.note||'', date0 = draft.date, direction0 = draft.direction, editingId = draft.editingEventId;
  const isPastOrToday = parseD(date0)<=TODAY;
  const type = direction0==='credit' ? 'deposit' : 'withdrawal';
  if(editingId){ inv_deleteCellEvent(id, editingId); }
  let amt = amt0;
  if(isPastOrToday && direction0==='debit') amt = Math.min(amt, inv.balance);
  const finalStatus = isPastOrToday ? 'confirmed' : status;
  inv.events = inv.events||[];
  inv.events.push({ id:newInvEventId(), type, date:date0, amount:amt, note:note0, status:finalStatus });
  if(isPastOrToday){
    inv.balance += invEventSign(type)*amt;
    inv.balanceDate = mkey(TODAY)+'-01';
  }
  closeSheet();
}
function renderInvCellActionSheet(){
  const { id } = state.sheet;
  const inv = id ? findInvestment(id) : null;
  const draft = state.invActionDraft;
  const isPastOrToday = parseD(draft.date)<=TODAY;
  const existing = inv ? invCellEvents(inv, draft.date).filter(e=>e.id!==draft.editingEventId) : [];
  const canSubmit = !!inv && draft.amount>0;
  const otherAccounts = investments.filter(i=>i.committed!==false);
  return `<div class="overlay" onclick="if(event.target===this) closeSheet()"><div class="sheet">
    <div class="sheet-handle"></div>
    ${sheetHead(inv?fmtMonth(parseD(draft.date)):'Add / Withdraw', inv?displayName(inv):'Choose an account', false)}
    <div class="dim" style="font-size:12px; margin-bottom:2px;">When</div>
    <input type="month" value="${mkey(parseD(draft.date))}" oninput="invAction_setDate(this.value)" style="background:var(--surface-3); border:1px solid var(--border); border-radius:10px; padding:9px 11px; color:var(--text); font-family:var(--font-mono); font-size:14px; font-weight:700; width:100%; margin-bottom:10px;"/>
    ${!inv ? `
    <div class="dim" style="font-size:12px; margin-bottom:2px;">Account</div>
    <div class="sort-row" style="margin:2px 0 0;">
      ${otherAccounts.length===0 ? `<div class="dim" style="font-size:12.5px;">No investments yet &mdash; add one first.</div>` : otherAccounts.map(o=>`<div class="chip" onclick="invAction_pickInv('${o.id}')">${displayName(o)}</div>`).join('')}
    </div>
    ` : `
    ${existing.length? `
    <div class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:2px;">Already logged this month</div>
    ${existing.map(e=>`<div class="entry-row">
      <div><span class="mono" style="font-weight:700;">${fmtSigned$(invEventSign(e.type)*e.amount)}</span>${e.note?` <span class="dim" style="font-size:12.5px;">&middot; ${e.note}</span>`:''}</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="entry-badge ${e.status||'confirmed'}">${e.status||'confirmed'}</span>
        <div class="entry-actions"><button onclick="inv_editCellEvent('${id}','${e.id}')">Edit</button><button class="danger" onclick="inv_deleteCellEvent('${id}','${e.id}')">Delete</button></div>
      </div>
    </div>`).join('')}
    ` : ''}
    <div class="dim" style="font-size:12px; margin-top:14px; margin-bottom:2px;">Direction</div>
    <div class="seg">
      <button class="${draft.direction==='debit'?'active':''}" onclick="invAction_setDirection('debit')">Debit (&minus;)</button>
      <button class="${draft.direction==='credit'?'active':''}" onclick="invAction_setDirection('credit')">Credit (+)</button>
    </div>
    <div class="dim" style="font-size:12px; margin:12px 0 2px;">Amount</div>
    <div class="input-row"><span class="suffix">$</span><input id="in-cell-amt" type="text" inputmode="decimal" value="${rv('in-cell-amt',draft.amount||'')}" oninput="RAW['in-cell-amt']=this.value; invAction_setAmount(this.value)"/></div>
    <div class="dim" style="font-size:12px; margin:12px 0 2px;">Note <span class="faint">(optional)</span></div>
    <div class="input-row"><input id="in-cell-note" type="text" value="${draft.note||''}" placeholder="e.g. Property taxes" oninput="invAction_setNote(this.value)" style="background:none;border:none;color:var(--text);font-family:var(--font-ui);font-size:15px;font-weight:600;outline:none;width:100%;"/></div>
    <div class="dim" style="font-size:11.5px; margin-top:10px;">Current balance: ${fmt$(inv.balance)}${!isPastOrToday?' &middot; unaffected until '+fmtMonth(parseD(draft.date)):''}</div>
    ${isPastOrToday ? `
    <div class="btn-row" style="margin-top:14px;">
      <div class="btn btn-primary" style="${canSubmit?'':'opacity:.5; pointer-events:none;'}" onclick="invAction_submitCell('confirmed')">Record</div>
    </div>
    <details class="footnote"><summary class="info-btn">&#9432;</summary><div class="footnote-body">This month is now or in the past, so this updates the real balance immediately.</div></details>
    ` : `
    <div class="btn-row" style="margin-top:14px;">
      <div class="btn btn-planned" style="${canSubmit?'':'opacity:.5; pointer-events:none;'}" onclick="invAction_submitCell('planned')">Plan (purple)</div>
      <div class="btn btn-confirm" style="${canSubmit?'':'opacity:.5; pointer-events:none;'}" onclick="invAction_submitCell('confirmed')">Lock in (teal)</div>
    </div>
    <details class="footnote"><summary class="info-btn">&#9432;</summary><div class="footnote-body">This is a future month, so neither option touches today's real balance &mdash; both just shape the timeline projection from ${fmtMonth(parseD(draft.date))} forward. Reconcile the real balance yourself when it actually happens.</div></details>
    `}
    ${draft.editingEventId? `<div style="text-align:center; margin-top:10px;"><button class="btn-ghost-sm" onclick="inv_cancelCellEdit()">Cancel edit</button></div>`:''}
    `}
  </div></div>`;
}

/* ============ FVM (Future Value Machine) ============
   Real accounts, hypothetical lump sum, laid out like the Monthly Timeline / Growth
   Schedule tables elsewhere in the app. Not a real transaction — nothing here ever
   touches inv.balance for longer than the single synchronous call that reads it. */
const FVM_MONTHS = 360; // 30 years
const FVM_1YR_STEPS = [1,2,3,4];
const FVM_5YR_STEPS = [5,10,15,20,25,30,35,40,45,50];
function fvm_setLump(v){ RAW['in-fvm-lump']=v; state.fvm.lump = parseFloat(v)||0; render(); }
function fvm_setLumpDirection(dir){ state.fvm.lumpDirection = dir; render(); }
function fvm_setLumpDate(v){ state.fvm.lumpDate = v ? v+'-01' : null; render(); }
function fvm_toggleWhatIf(){ state.fvm.whatIfOpen = !state.fvm.whatIfOpen; render(); }
function fvm_openWhatIf(direction){
  state.fvm.saleOpen = false;
  if(direction) state.fvm.lumpDirection = direction;
  openSheet({type:'fvmWhatIf'});
}
function fvm_toggleSale(){ state.fvm.saleOpen = !state.fvm.saleOpen; render(); }
function fvm_setSaleProp(id){ state.fvm.salePropId = id||null; render(); }
function fvm_setSalePrice(v){ RAW['in-fvm-saleprice']=v; state.fvm.salePrice = parseFloat(v)||0; render(); }
function fvm_setSaleCostPct(v){ RAW['in-fvm-salecost']=v; state.fvm.saleCostPct = parseFloat(v)||0; render(); }
function fvm_setSaleTaxPct(v){ RAW['in-fvm-saletax']=v; state.fvm.saleTaxPct = parseFloat(v)||0; render(); }
function fvmSaleNetProceeds(){
  const f = state.fvm;
  const prop = findProperty(f.salePropId);
  if(!prop) return 0;
  const payoff = propertyCurrent(prop).balance;
  const price = f.salePrice||0;
  const costs = price*(f.saleCostPct||0)/100;
  const gain = Math.max(0, price - payoff - costs);
  const taxes = gain*(f.saleTaxPct||0)/100;
  return Math.max(0, price - payoff - costs - taxes);
}
/* Whichever number is currently driving the hypothetical column: a typed lump sum,
   or the computed net proceeds from the sale calculator. Neither is real until you
   actually go make the move — this only ever feeds a preview column. */
function fvmEffectiveLump(){
  const f = state.fvm;
  if(!f.whatIfOpen) return 0;
  if(f.saleOpen) return fvmSaleNetProceeds(); // a sale is always an inflow — the direction toggle only applies to a typed amount
  const amt = f.lump||0;
  return f.lumpDirection==='spend' ? -amt : amt;
}
function fvmEffectiveExcludeProp(){
  const f = state.fvm;
  return (f.whatIfOpen && f.saleOpen && f.salePropId) ? f.salePropId : null;
}
/* Single pass across every real investment together — the same style as computeGrowthShareSeries,
   just tracking running balance instead of monthly interest, and covering every account (not only
   the growth-share ones) so FVM can total the whole portfolio at each month with one walk instead
   of calling invBalanceAtDate per month (which would be O(months^2) again). */
function fvmBalanceSeries(monthsCount, excludePropId, boostSpec, excludeFromIdx){
  excludeFromIdx = excludeFromIdx||0;
  const invs = investments.filter(i=>i.committed!==false);
  const targets = growthShareTargets();
  const targetIds = new Set(targets.map(t=>t.id));
  const bals = {}; invs.forEach(inv=> bals[inv.id] = inv.balance||0);
  if(boostSpec && boostSpec.idx===0 && bals[boostSpec.invId]!==undefined){
    bals[boostSpec.invId] = Math.max(0, bals[boostSpec.invId]+boostSpec.amount);
  }
  const result = {}; invs.forEach(inv=> result[inv.id] = new Array(monthsCount));
  const interestByInv = {}; invs.forEach(inv=> interestByInv[inv.id] = new Array(monthsCount));
  const growth = new Array(monthsCount); // total receivables minus spending draw, unclamped — same figure as Income's "Growth" stat, every month
  // Tracked separately because they hit different places: property tax comes out before that
  // income joins the shared pool, so it reduces growth[i]; investment tax comes out of that
  // account's own balance directly, like a withdrawal, and never touches the pool at all.
  const taxFromProps = new Array(monthsCount).fill(0);
  const taxFromInvs = new Array(monthsCount).fill(0);
  for(let i=0;i<monthsCount;i++){
    const date = addM(TODAY, i);
    if(i>0){
      invs.forEach(inv=>{
        if(targetIds.has(inv.id)) return; // handled jointly below
        (inv.events||[]).forEach(e=>{ if(mkey(parseD(e.date))===mkey(date)) bals[inv.id]+=invEventSign(e.type)*e.amount; });
        if(inv.recurring && inv.recurring.amount>0 && date>=parseD(inv.recurring.startDate)){
          bals[inv.id] += (inv.recurring.direction==='debit'?-1:1)*inv.recurring.amount;
        }
        bals[inv.id] = Math.max(0, bals[inv.id]);
      });
      targets.forEach(t=>{ (t.events||[]).forEach(e=>{ if(mkey(parseD(e.date))===mkey(date)) bals[t.id]+=invEventSign(e.type)*e.amount; }); });
      // A future-dated what-if lump lands here, mid-walk, so it participates in growth-share
      // allocation and compounding exactly like a real dated event would — same reason
      // interestByInv is captured before allocation: order matters for every figure downstream.
      if(boostSpec && boostSpec.idx===i && bals[boostSpec.invId]!==undefined){
        bals[boostSpec.invId] = Math.max(0, bals[boostSpec.invId]+boostSpec.amount);
      }
    }
    // Captured here, on the balance carried in before this month's growth-share allocation —
    // this is the exact figure that feeds "growth" below, so anything explaining growth
    // (like the breakdown sheets) must read interestByInv, not reconstruct it from the
    // balances array, which reflects the *post*-allocation state instead.
    invs.forEach(inv=>{ interestByInv[inv.id][i] = bals[inv.id]*(inv.rate||0)/100/12; });
    const nonGrowthInterest = invs.filter(inv=>!targetIds.has(inv.id)).reduce((s,inv)=> s+interestByInv[inv.id][i], 0);
    const targetsInterest = targets.reduce((s,t)=> s+interestByInv[t.id][i], 0);
    const totalInterest = nonGrowthInterest + targetsInterest;
    const propCFByProp = {};
    let propLoan = 0;
    properties.forEach(p=>{ const cf = (p.id!==excludePropId || i<excludeFromIdx) ? propertyCashFlowAtDate(p, date) : 0; propCFByProp[p.id]=cf; propLoan += cf; });
    standaloneLoans.forEach(l=>{ if(l.committed!==false) propLoan -= standaloneLoanPaymentAtDate(l.id, date); });
    // Estimated quarterly tax: each property/account annualizes at THIS month's run-rate
    // (a simplification — the app has no concept of trailing income — but "close" per the
    // household's own framing), pays its own proportional share of the fed+state bracket
    // calc on total income, taken out of that same source (property income before it joins
    // the shared pool; investment balance directly) rather than a single household draw.
    if(i>0 && tax_isDueMonth(date)){
      let totalAnnual = 0;
      const annualBySource = {};
      properties.forEach(p=>{ const a = propCFByProp[p.id]*12; annualBySource['prop:'+p.id]=a; totalAnnual+=a; });
      invs.forEach(inv=>{ const a = interestByInv[inv.id][i]*12; annualBySource['inv:'+inv.id]=a; totalAnnual+=a; });
      const quarterlyTax = taxAnnualTotal(totalAnnual)/4;
      if(quarterlyTax>0 && totalAnnual>0){
        properties.forEach(p=>{
          const amt = quarterlyTax*(annualBySource['prop:'+p.id]/totalAnnual);
          propCFByProp[p.id] -= amt; propLoan -= amt; taxFromProps[i] += amt;
        });
        invs.forEach(inv=>{
          const amt = quarterlyTax*(annualBySource['inv:'+inv.id]/totalAnnual);
          bals[inv.id] = Math.max(0, bals[inv.id]-amt); taxFromInvs[i] += amt;
        });
      }
    }
    const spending = effectiveSpendingAtDate(date, totalInterest);
    const pool = propLoan + totalInterest - spending;
    growth[i] = pool;
    if(i>0 && targets.length){
      const clampedPool = Math.max(0, pool);
      const fixedTargets = targets.filter(t=> t.recurring.startDate<=mkey(date)+'-01' && t.recurring.growthShare.mode==='fixed');
      const totalFixedAsk = fixedTargets.reduce((s,t)=>s+t.recurring.growthShare.value,0);
      const remainder = Math.max(0, clampedPool-Math.min(totalFixedAsk,clampedPool));
      targets.forEach(t=>{
        if(t.recurring.startDate>mkey(date)+'-01') return;
        let alloc = 0;
        if(t.recurring.growthShare.mode==='fixed'){
          alloc = totalFixedAsk<=clampedPool ? t.recurring.growthShare.value : (totalFixedAsk>0 ? clampedPool*(t.recurring.growthShare.value/totalFixedAsk) : 0);
        } else {
          alloc = remainder*(t.recurring.growthShare.value/100);
        }
        bals[t.id] = Math.max(0, bals[t.id]+alloc);
      });
    }
    invs.forEach(inv=>{
      result[inv.id][i] = bals[inv.id];
      bals[inv.id] += bals[inv.id]*(inv.rate||0)/100/12;
    });
  }
  return { balances: result, growth, interestByInv, taxFromProps, taxFromInvs };
}
/* Boosts (or drains) one account at a chosen month — today by default — and optionally excludes
   a sold property's cash flow from the shared pool, then returns every account's series at once.
   Feeds a boostSpec into fvmBalanceSeries rather than pre-mutating inv.balance, since a future
   date needs the amount applied mid-walk, not before it. */
function fvmSeriesWithLump(boostInvId, boostAmount, boostDateStr, excludePropId, monthsCount){
  const idx = boostDateStr ? Math.max(0, Math.min(monthsCount-1, monthIndexFromToday(parseD(boostDateStr)))) : 0;
  const boostSpec = (boostInvId && boostAmount) ? { invId: boostInvId, amount: boostAmount, idx } : null;
  return fvmBalanceSeries(monthsCount, excludePropId, boostSpec, idx);
}
function fvmBuildColumns(){
  const f = state.fvm;
  const lump = fvmEffectiveLump();
  const excludeProp = fvmEffectiveExcludeProp();
  const series = fvmSeriesWithLump(f.selectedCol, lump, f.lumpDate, excludeProp, FVM_MONTHS);
  const cols = investments.filter(i=>i.committed!==false).map(inv=>({
    id: inv.id, label: displayName(inv), series: series.balances[inv.id], boosted: inv.id===f.selectedCol && lump!==0
  }));
  const gt = new Array(FVM_MONTHS).fill(0);
  cols.forEach(c=>{ for(let i=0;i<FVM_MONTHS;i++) gt[i]+=c.series[i]; });
  return { cols, gtSeries: gt, growthSeries: series.growth };
}
/* "How did we get this number" breakdowns — reused from FVM's table cells, FVM/Income's
   shared header stats, and appended to the existing Growth sheet. Total/Growth breakdowns
   both work for any date, not just today, so a future table cell can explain itself too. */
function fvmTotalBreakdownAt(dateStr){
  const idx = Math.max(0, Math.min(FVM_MONTHS-1, monthIndexFromToday(parseD(dateStr))));
  const {cols} = fvmBuildColumns();
  const items = cols.map(c=>({name:c.label, amount: c.series[idx]}));
  const total = items.reduce((s,x)=>s+x.amount,0);
  return {items, total};
}
function fvmGrowthBreakdownAt(dateStr){
  const date = parseD(dateStr);
  const idx = Math.max(0, monthIndexFromToday(date));
  // Use fvmBalanceSeries's own interestByInv directly, not invMonthlyReturnAtDate (which routes
  // growth-share investments through a separate, older joint-walk) and not the balances array
  // (which reflects the state *after* that month's allocation — growth itself is computed from
  // the balance carried in *before* it). Same figures the table itself used, not a reconstruction.
  const { interestByInv, taxFromProps } = fvmBalanceSeries(idx+1);
  const propItems = properties.map(p=>({name:displayName(p), amount: propertyCashFlowAtDate(p, date)}));
  const loanItems = standaloneLoans.filter(l=>l.committed!==false).map(l=>({name:displayName(findProperty(l.id))||'Loan', amount: -standaloneLoanPaymentAtDate(l.id, date)}));
  const invItems = investments.filter(i=>i.committed!==false).map(i=>({name:displayName(i), amount: interestByInv[i.id] ? interestByInv[i.id][idx] : 0}));
  const taxAmt = taxFromProps ? taxFromProps[idx] : 0;
  const taxItems = taxAmt>0.5 ? [{name:'Estimated taxes', amount:-taxAmt}] : [];
  const receivables = [...propItems, ...loanItems, ...invItems, ...taxItems];
  const totalReceivables = receivables.reduce((s,x)=>s+x.amount,0);
  const investmentInterest = invItems.reduce((s,x)=>s+x.amount,0);
  const spending = effectiveSpendingAtDate(date, investmentInterest);
  return { receivables, totalReceivables, spending, growth: totalReceivables-spending };
}
function fvmBreakdownRows(items){
  return items.filter(x=>Math.abs(x.amount)>0.5).map(x=>`<div class="row-line"><span class="l">${x.name}</span><span class="v" style="color:${x.amount>=0?'var(--principal)':'var(--interest)'};">${fmtSigned$(x.amount)}</span></div>`).join('');
}
function fvm_showBreakdown(kind, dateStr){ openSheet({type:'fvmBreakdown', kind, date:dateStr}); }
function fvm_selectCol(id){ state.fvm.selectedCol = id; state.multCursor = -1; openSheet({type:'fvmColDetail'}); }
function fvmActiveSeries(){
  const {cols, gtSeries} = fvmBuildColumns();
  if(state.fvm.selectedCol==='gt') return gtSeries;
  const col = cols.find(c=>c.id===state.fvm.selectedCol);
  return col ? col.series : gtSeries;
}
/* Shared by FVM and Income's timeline nav — same cursors (state.yr1Idx etc.), so
   stepping forward on one and switching tabs continues the same cycle on the other,
   matching the shared scroll position they already keep in sync. */
function timelineClearJumpButtons(barId){ document.querySelectorAll('#'+barId+' button').forEach(b=>b.classList.remove('active')); }
function timelineScrollTo(winId, rowPrefix, idx){
  const win = document.getElementById(winId);
  const el = document.getElementById(rowPrefix+idx);
  timelineCenterRow(win, el);
  state.timelineDate = mkey(addM(TODAY, idx));
  // Jump buttons deliberately skip the full render() (it would also reset scroll on the
  // amort window) so the highlight has to be applied by hand here, mirroring the jump
  // bar's own imperative active-state updates just below each call site.
  if(win){
    const prev = win.querySelector('.state-planned');
    if(prev) prev.classList.remove('state-planned');
    if(el && idx!==0) el.classList.add('state-planned');
  }
}
function timelineJump(winId, rowPrefix, monthsCap, barId, btnPrefix, target){
  if(target==='beginning' || target==='current'){ timelineScrollTo(winId, rowPrefix, 0); state.multCursor=-1; state.yr1Idx=-1; state.yr5Idx=-1; }
  if(target==='end'){ timelineScrollTo(winId, rowPrefix, monthsCap-1); }
  timelineClearJumpButtons(barId);
  const btn = document.getElementById(btnPrefix+target);
  if(btn) btn.classList.add('active');
}
function timelineYr1Jump(winId, rowPrefix, monthsCap, barId, btnPrefix){
  state.yr1Idx = (state.yr1Idx+1) % FVM_1YR_STEPS.length;
  state.yr5Idx = -1; state.multCursor = -1;
  const years = FVM_1YR_STEPS[state.yr1Idx];
  timelineScrollTo(winId, rowPrefix, Math.min(monthsCap-1, years*12));
  timelineClearJumpButtons(barId);
  const btn = document.getElementById(btnPrefix+'yr1');
  if(btn){ btn.classList.add('active'); btn.textContent = years+' yr'; }
}
function timelineYr5Jump(winId, rowPrefix, monthsCap, barId, btnPrefix){
  state.yr5Idx = (state.yr5Idx+1) % FVM_5YR_STEPS.length;
  state.yr1Idx = -1; state.multCursor = -1;
  const years = FVM_5YR_STEPS[state.yr5Idx];
  timelineScrollTo(winId, rowPrefix, Math.min(monthsCap-1, years*12));
  timelineClearJumpButtons(barId);
  const btn = document.getElementById(btnPrefix+'yr5');
  if(btn){ btn.classList.add('active'); btn.textContent = years+' yr'; }
}
function fvmScrollTo(idx){ timelineScrollTo('fvmWindow','fvmrow-',idx); }
function fvmJump(target){ timelineJump('fvmWindow','fvmrow-',FVM_MONTHS,'fvmJump','fvmjump-',target); }
function fvm_yr1Jump(){ timelineYr1Jump('fvmWindow','fvmrow-',FVM_MONTHS,'fvmJump','fvmjump-'); }
function fvm_yr5Jump(){ timelineYr5Jump('fvmWindow','fvmrow-',FVM_MONTHS,'fvmJump','fvmjump-'); }
function income_yr1Jump(){ timelineYr1Jump('incomeWindow','incomerow-',INCOME_MONTHS_AHEAD,'incomeJump','incomejump-'); }
function income_yr5Jump(){ timelineYr5Jump('incomeWindow','incomerow-',INCOME_MONTHS_AHEAD,'incomeJump','incomejump-'); }
function incomeJump(target){ timelineJump('incomeWindow','incomerow-',INCOME_MONTHS_AHEAD,'incomeJump','incomejump-',target); }
/* Growing accounts cycle through 2x/4x/8x... (when does this double, quadruple).
   Accounts on their way down instead cycle through -2x/-4x/-8x (when does this
   halve, quarter, eighth) plus a final stop for hitting $0, if it gets there —
   the milestone that actually matters for a drawdown, not a growth, account. */
function fvmMultiplierPoints(series){
  const start = series[0];
  if(start<=0) return [];
  const growing = series[series.length-1] >= start;
  const pts = INV_MULTIPLIERS.map(m=>{
    const idx = growing ? series.findIndex(v=>v>=start*m) : series.findIndex(v=>v<=start/m);
    return { label:(growing?'':'-')+m+'×', idx };
  }).filter(x=>x.idx>=0);
  if(!growing){
    const zeroIdx = series.findIndex(v=>v<=0);
    if(zeroIdx>=0 && !pts.some(p=>p.idx===zeroIdx)) pts.push({ label:'$0', idx:zeroIdx });
  }
  return pts;
}
function fvm_multiplierJump(){
  const series = fvmActiveSeries();
  const mults = fvmMultiplierPoints(series);
  if(!mults.length) return;
  state.multCursor = (state.multCursor+1) % mults.length;
  state.yr1Idx = -1; state.yr5Idx = -1;
  const target = mults[state.multCursor];
  fvmScrollTo(target.idx);
  timelineClearJumpButtons('fvmJump');
  const btn = document.getElementById('fvmjump-mult');
  if(btn){ btn.classList.add('active'); btn.textContent = target.label; }
}
function fvmSelectedDetailCard(){
  const f = state.fvm;
  if(f.selectedCol==='gt'){
    return `<div class="dim" style="font-size:12.5px;">Every investment balance added together &mdash; the liquid, sellable part of your net worth. Doesn't include property value, since that's latent until sold.</div>`;
  }
  const inv = findInvestment(f.selectedCol);
  if(!inv) return '';
  const lump = fvmEffectiveLump();
  const lumpWhen = state.fvm.lumpDate ? fmtMonth(parseD(state.fvm.lumpDate)) : 'today';
  return `
    ${lump!==0 ? `<div style="font-size:12.5px; font-weight:700; color:${lump>0?'var(--principal)':'var(--interest)'}; margin-bottom:10px; background:${lump>0?'var(--principal-soft)':'var(--interest-soft)'}; border-radius:8px; padding:7px 10px;">${fmtSigned$(lump)} hypothetical ${lump>0?'addition':'withdrawal'} applied ${lumpWhen} &mdash; this is the account getting it</div>` : ''}
    <div class="dim" style="font-size:11px;">Balance</div>
    <div class="big-number" style="margin-top:2px; font-size:22px;">${fmt$(inv.balance)}</div>
    <div class="stat-row" style="margin-top:10px;">
      <div class="stat-pill"><div class="v" style="color:var(--forgone); font-size:14px;">${fmtPct(inv.rate)}</div><div class="l">Rate (APY)</div></div>
      <div class="stat-pill"><div class="v" style="color:var(--principal); font-size:14px;">${fmtSigned$(invMonthlyReturn(inv))}</div><div class="l">Est. monthly</div></div>
    </div>
    ${invRecurringActive(inv) ? (inv.recurring.growthShare
      ? `<div class="dim" style="font-size:11px; margin-top:10px; color:var(--principal);">Growth share: ${inv.recurring.growthShare.mode==='pct'?inv.recurring.growthShare.value+'%':fmt$(inv.recurring.growthShare.value)}${inv.recurring.note?' &middot; '+inv.recurring.note:''}</div>`
      : `<div class="dim" style="font-size:11px; margin-top:10px; color:${inv.recurring.direction==='debit'?'var(--interest)':'var(--principal)'};">${inv.recurring.direction==='debit'?'&minus;':'+'}${fmt$(inv.recurring.amount)}/mo recurring${inv.recurring.note?' &middot; '+inv.recurring.note:''}</div>`
    ) : ''}
    <div style="text-align:right; margin-top:8px;"><span class="link" style="font-size:12.5px;" onclick="state.returnToSheet={type:'fvmColDetail'}; closeSheet(); push({type:'investment', id:'${inv.id}'})">Edit this account &rsaquo;</span></div>
  `;
}
function renderFVM(){
  const f = state.fvm;
  const firstReal = investments.find(i=>i.committed!==false);
  if(!f.selectedCol && firstReal) f.selectedCol = firstReal.id;
  const totalMonthly = incomeSources().reduce((s,x)=>s+x.amount,0);
  const lump = fvmEffectiveLump();
  const {cols, gtSeries, growthSeries} = fvmBuildColumns();
  const totalInvBalance = investments.filter(i=>i.committed!==false).reduce((s,i)=>s+(i.balance||0),0);
  const spendingToday = effectiveSpendingAtDate(TODAY);
  const growthToday = totalMonthly - spendingToday;

  return `
  <div class="tab-header-sticky">
    <div class="header" style="margin-bottom:14px;">
      <h1>FVM</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="iconbtn" onclick="push({type:'settings'})">${tabIcon('gear')}</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-pill" style="cursor:pointer;" onclick="fvm_showBreakdown('receivables','${mkey(TODAY)}-01')"><div class="v" style="color:${totalMonthly>=0?'var(--text)':'var(--interest)'};">${fmt$(totalMonthly)}</div><div class="l">${fmtMonth(TODAY)}</div></div>
      <div class="stat-pill" style="cursor:pointer;" onclick="openSheet({type:'incomeAdjust'})"><div class="v">${fmt$(spendingToday)}</div><div class="l">Income &rsaquo;</div></div>
      <div class="stat-pill" style="cursor:pointer;" onclick="openSheet({type:'growthTarget'})"><div class="v" style="color:${growthToday>=0?'var(--principal)':'var(--interest)'}">${fmtSigned$(growthToday)}</div><div class="l">Growth &rsaquo;</div></div>
    </div>
    <div class="dim" style="font-size:11.5px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        Grand Total today: <b class="mono" style="color:var(--accent); font-weight:700; cursor:pointer;" onclick="fvm_showBreakdown('total','${mkey(TODAY)}-01')">${fmt$(totalInvBalance)}</b>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <details class="footnote" style="margin:0; position:relative;"><summary class="info-btn" style="width:26px; height:26px;">&#9432;</summary><div class="footnote-body" style="position:absolute; right:0; top:32px; width:260px; background:var(--surface-3); border:1px solid var(--border); border-radius:12px; padding:12px 14px; z-index:20; font-size:12px; line-height:1.5;">Growth is what's left each month after spending &mdash; the same number driving Grand Total's climb. Tap a column to select it, then use &times; to jump to when <i>it</i> doubles, quadruples, and so on. Grand Total is every investment added together, not property value.</div></details>
        <div class="iconbtn" style="width:26px; height:26px; color:var(--principal); font-weight:800; font-size:16px;" onclick="fvm_openWhatIf('add')" title="What if I add money">+</div>
        <div class="iconbtn" style="width:26px; height:26px; color:var(--interest); font-weight:800; font-size:16px;" onclick="fvm_openWhatIf('spend')" title="What if I spend money">&minus;</div>
      </div>
    </div>
  </div>

  <div class="amort-jump" id="fvmJump">
    <button id="fvmjump-yr1" onclick="fvm_yr1Jump()">1 yr</button>
    <button id="fvmjump-yr5" onclick="fvm_yr5Jump()">5 yr</button>
    <button id="fvmjump-mult" onclick="fvm_multiplierJump()">2&times;</button>
    <button id="fvmjump-current" class="active" onclick="fvmJump('current')">Current</button>
  </div>
  <div class="amort-window scrollx" id="fvmWindow">
  <table class="amort">
    <thead><tr>
      <th>Date</th>
      <th>Growth</th>
      <th style="cursor:pointer; ${f.selectedCol==='gt'?'color:var(--accent); text-decoration:underline;':''}" onclick="fvm_selectCol('gt')">Grand Total</th>
      ${cols.map(c=>`<th style="cursor:pointer; ${c.id===f.selectedCol?'color:var(--accent); text-decoration:underline;':''}" onclick="fvm_selectCol('${c.id}')">${(c.boosted?(lump>0?'+ ':'&minus; '):'')+(c.label.length>11?c.label.slice(0,10)+'&hellip;':c.label)}</th>`).join('')}
    </tr></thead>
    <tbody>
    ${Array.from({length:FVM_MONTHS}, (_,i)=>{
      const date = addM(TODAY, i);
      const dateStr = mkey(date)+'-01';
      const g = growthSeries[i];
      return `<tr id="fvmrow-${i}" class="${timelineRowClass(i, FVM_MONTHS)}">
        <td>${fmtMonth(date)}</td>
        <td style="cursor:pointer; color:${g>=0?'var(--principal)':'var(--interest)'};" onclick="fvm_showBreakdown('growth','${dateStr}')">${fmtSigned$(g)}</td>
        <td style="cursor:pointer; ${f.selectedCol==='gt'?'font-weight:700; color:var(--principal);':''}" onclick="fvm_showBreakdown('total','${dateStr}')">${fmt$(gtSeries[i])}</td>
        ${cols.map(c=>`<td style="cursor:pointer; ${c.id===f.selectedCol?'font-weight:700; color:var(--principal);':''}" onclick="inv_openCellAction('${c.id}','${dateStr}')">${fmt$(c.series[i])}</td>`).join('')}
      </tr>`;
    }).join('')}
    </tbody>
  </table>
  </div>
  `;
}

loadLocalData();
render();
</script>
